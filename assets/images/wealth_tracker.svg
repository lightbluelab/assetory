<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Asseta Apple Glass</title>
  <desc id="desc">Three translucent asset layers connected by a flowing glass ribbon.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="76%">
      <stop offset="0" stop-color="#172849"/>
      <stop offset="1" stop-color="#0d1830"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d1f7df"/>
      <stop offset=".55" stop-color="#aeeaca"/>
      <stop offset="1" stop-color="#82d8b4"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#71d9b3"/>
      <stop offset="1" stop-color="#35b993"/>
    </linearGradient>
    <linearGradient id="low" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#34a983"/>
      <stop offset="1" stop-color="#15725f"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="18" y1="49" x2="48" y2="15" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54c89e" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#b7efd2" stop-opacity=".88"/>
      <stop offset="1" stop-color="#d6f7e2" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f1fff6" stop-opacity=".72"/>
      <stop offset="1" stop-color="#f1fff6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.7" stdDeviation="1.5" flood-color="#020817" flood-opacity=".38"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation=".7"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="13.5" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="9.5" y="13.8" width="45" height="10.2" rx="5.1" fill="url(#top)" stroke="#dffbec" stroke-opacity=".56" stroke-width=".7"/>
    <rect x="9.5" y="26.1" width="45" height="10.2" rx="4.5" fill="url(#mid)" stroke="#9de8ca" stroke-opacity=".48" stroke-width=".7"/>
    <rect x="9.5" y="38.4" width="45" height="10.2" rx="4.5" fill="url(#low)" stroke="#73d4b1" stroke-opacity=".42" stroke-width=".7"/>
    <path d="M13 46.1C18.2 51.3 23.5 46.9 27.4 40.2L38.8 20.6C43.2 13.1 48.2 11.5 52.5 15.3C55.4 17.9 55.8 22.1 54.1 24.3C52.7 20.9 49.2 19.1 46.7 23.3L34.8 43.7C29.5 52.8 21.5 55.6 15 51.4C12.8 50 11.4 47.9 11.2 45.4Z" fill="#8ce0ba" opacity=".24" filter="url(#glow)"/>
    <path d="M12 44.8C17.2 50 22.6 45.7 26.5 39L37.9 19.4C42.3 11.9 47.3 10.3 51.6 14.1C54.5 16.7 54.9 20.9 53.2 23.1C51.8 19.7 48.3 17.9 45.8 22.1L33.9 42.5C28.6 51.6 20.6 54.4 14.1 50.2C11.9 48.8 10.5 46.7 10.3 44.2Z" fill="url(#ribbon)" stroke="#dffbea" stroke-opacity=".68" stroke-width=".7"/>
    <path d="M11.1 43.9C16 48.5 21.3 44.2 25.2 37.6L36.8 17.8C41.1 10.6 46.7 10.1 50.7 13.5" fill="none" stroke="#f2fff7" stroke-opacity=".7" stroke-width=".65" stroke-linecap="round"/>
    <path d="M14.6 14.8H49.2" stroke="url(#shine)" stroke-width=".7" stroke-linecap="round"/>
    <path d="M14.6 27.1H49.2" stroke="url(#shine)" stroke-width=".55" stroke-linecap="round" opacity=".66"/>
    <path d="M14.6 39.4H49.2" stroke="url(#shine)" stroke-width=".5" stroke-linecap="round" opacity=".48"/>
  </g>
</svg>
