<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Wealth Tracker — Layered Assets</title>
  <desc id="desc">Three asset layers crossed by a rising translucent ribbon.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#17294b"/>
      <stop offset="1" stop-color="#0b1730"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a9f5cb"/>
      <stop offset="1" stop-color="#77d9b3"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#20b97f"/>
      <stop offset="1" stop-color="#25c48c"/>
    </linearGradient>
    <linearGradient id="low" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#169578"/>
      <stop offset="1" stop-color="#14775f"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="16" y1="47" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3dc59a"/>
      <stop offset=".52" stop-color="#9be8c4"/>
      <stop offset="1" stop-color="#c7f8dd"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020817" flood-opacity=".36"/>
    </filter>
    <clipPath id="mark"><rect x="15" y="16" width="34" height="32" rx="7"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#mark)" filter="url(#shadow)">
    <rect x="15" y="16" width="34" height="8" fill="url(#top)"/>
    <rect x="15" y="27" width="34" height="8" fill="url(#mid)"/>
    <rect x="15" y="38" width="34" height="10" fill="url(#low)"/>
    <path d="M14.5 42.2C19 49.4 25.5 40 31 30.6 37.6 19.4 43.1 13.9 49.5 17.1V25c-5.2-3.5-9.5 1.3-14.9 10.6-7.3 12.5-14.9 19.4-20.1 12.2z" fill="#071d30" opacity=".27" transform="translate(1.5 1.2)"/>
    <path d="M14.5 40.5C19 47.7 25.5 38.3 31 28.9 37.6 17.7 43.1 12.2 49.5 15.4V23.3c-5.2-3.5-9.5 1.3-14.9 10.6-7.3 12.5-14.9 19.4-20.1 12.2z" fill="url(#ribbon)" opacity=".91"/>
    <path d="M17 42.2C22.5 42.9 27.5 34.1 32.7 25.7 38.2 16.9 43.9 13.6 48.7 16" fill="none" stroke="#e4fff0" stroke-width="1.15" stroke-linecap="round" opacity=".65"/>
  </g>
</svg>
