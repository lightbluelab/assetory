// ---------- 股价自动更新 (腾讯 + 东财) ----------
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
// 目标日期: 当月月末与今天取较早者(未到月末→今天)
function targetDate(monthKey){
  const [y,mo]=monthKey.split("-").map(Number);
  const monthEnd=new Date(y,mo,0);
  const today=new Date();
  return (monthEnd<today?monthEnd:today);
}
function isCurMonth(monthKey){
  const now=new Date();
  return monthKey===now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
}
// 从日线数组中挑 <= 目标日 的最后一个交易日, 且必须贴近目标(避免落到远古数据)
function pickClose(rows, monthKey){
  const tgt=ymd(targetDate(monthKey));
  rows=(rows||[]).filter(r=>r.date && !isNaN(r.close));
  let pick=null;
  for(const r of rows){ if(r.date<=tgt) pick=r; else break; }
  if(!pick) throw new Error("目标日期前无交易数据");
  if(!(pick.close>0)) throw new Error("收盘价无效");
  const gap=(new Date(tgt)-new Date(pick.date))/86400000;
  if(gap>10) throw new Error(`最近交易日(${pick.date})距目标(${tgt})过远,数据缺失`);
  return { price:pick.close, date:pick.date };
}

function normalizedMarket(market){
  const raw=String(market||"").trim().toLowerCase().replace(/[\s._-]/g,"");
  if(["us","usa","美股","美国","美国股票","nasdaq","nyse","amex"].includes(raw)) return "us";
  if(["hk","港股","香港"].includes(raw)) return "hk";
  return "cn";
}
function normalizedUsSymbol(symbol){
  return String(symbol||"").trim().toUpperCase()
    .replace(/^(?:US|NASDAQ|NYSE|AMEX)[:.]/,"")
    .replace(/\.(?:US|O|N|AM)$/," ").trim();
}
// 腾讯代码: A股 sh600519 / sh510500 / 港股 hk00700 / 美股 usAAPL
function tencentCode(market, symbol){
  const s=(symbol||"").trim(); const m=normalizedMarket(market);
  if(m==="hk") return "hk"+s.replace(/\D/g,"").padStart(5,"0");
  if(m==="us") return "us"+normalizedUsSymbol(s);
  if(/^(sh|sz)/i.test(s)) return s.toLowerCase();
  // 沪市除 6 开头股票外，也包括 5 开头 ETF/基金和 9 开头 B 股。
  return (/^[569]/.test(s)?"sh":"sz")+s;
}
function parseTencentQuote(raw,fallbackDate=ymd(new Date())){
  if(Array.isArray(raw)) raw=raw.join("~");
  const fields=String(raw||"").split("~");
  const price=parseFloat(fields[3]);
  if(!Number.isFinite(price)||price<=0) return null;
  const quoteDate=(String(raw).match(/\d{4}-\d{2}-\d{2}/)||[])[0]||fallbackDate;
  return {price,date:quoteDate};
}
function quoteNearTarget(quote,monthKey){
  if(!quote?.date) return false;
  const target=ymd(targetDate(monthKey));
  const gap=(new Date(`${target}T00:00:00`)-new Date(`${quote.date}T00:00:00`))/86400000;
  return gap>=0&&gap<=10;
}
// 腾讯实时接口允许跨域读取，直接 fetch 比动态脚本注入更稳定，尤其适用于 PWA。
async function tencentRealtime(code){
  const res=await fetch(`https://qt.gtimg.cn/q=${encodeURIComponent(code)}`,{cache:"no-store"});
  if(!res.ok) throw new Error(`报价接口 HTTP ${res.status}`);
  const text=await res.text();
  const raw=text.match(/="([^"]*)"/)?.[1];
  const quote=parseTencentQuote(raw);
  if(!quote) throw new Error("无有效实时价格");
  return {...quote,src:"实时"};
}
// 腾讯日K线: 部分美股不提供 day 数组，但会在同一响应里提供最新收盘报价。
async function tencentKline(code, monthKey){
  const beg=monthKey+"-01", end=ymd(targetDate(monthKey));
  const url=`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${code},day,${beg},${end},40,bfq`;
  const res=await fetch(url);
  if(!res.ok) throw new Error(`腾讯日线 HTTP ${res.status}`);
  const data=await res.json();
  const node=data.data && data.data[code];
  const arr=(node && (node.day||node.qfqday))||[];
  if(arr.length){
    const rows=arr.map(r=>({date:r[0], close:parseFloat(r[2])}));
    return pickClose(rows,monthKey);
  }
  const quote=parseTencentQuote(node?.qt?.[code]);
  if(quoteNearTarget(quote,monthKey)) return {...quote,src:"月末报价"};
  throw new Error(quote?.date?`日线为空，报价日期 ${quote.date} 不适用于 ${monthKey}`:"腾讯无可用日线或报价");
}
// 新浪美股日线使用 JSONP，可在浏览器端跨域读取，作为腾讯未覆盖旧月份时的回退。
let sinaRequestQueue=Promise.resolve();
function sinaUsKline(symbol,monthKey){
  const request=sinaRequestQueue.then(()=>loadSinaUsKline(symbol,monthKey));
  sinaRequestQueue=request.catch(()=>{});
  return request;
}
function loadSinaUsKline(symbol,monthKey){
  return new Promise((resolve,reject)=>{
    const callback="__wealthTrackerSinaData";
    const script=document.createElement("script");
    let settled=false;
    // 新浪脚本通过全局 var 写入数据，该属性在严格模式下不可 delete，只能安全置空。
    const cleanup=()=>{ clearTimeout(timer); script.remove(); try{ window[callback]=undefined; }catch(error){ /* 全局 var 不可删除，置空失败也不影响报价结果 */ } };
    const fail=(message,error)=>{ cleanup(); reject(error instanceof Error?error:new Error(message)); };
    const succeed=rows=>{
      try{
        settled=true;
        cleanup();
        const parsed=(rows||[]).map(row=>({date:row.d,close:parseFloat(row.c)}));
        const result={...pickClose(parsed,monthKey),src:"新浪历史收盘"};
        resolve(result);
      }catch(error){ fail(`新浪历史报价无效：${error.message}`,error); }
    };
    const timer=setTimeout(()=>{ if(!settled) fail("新浪历史报价超时"); },30000);
    window[callback]=undefined;
    script.async=true;
    script.src=`https://stock.finance.sina.com.cn/usstock/api/jsonp.php/var%20${callback}=/US_MinKService.getDailyK?symbol=${encodeURIComponent(normalizedUsSymbol(symbol))}&_=${Date.now()}`;
    script.onload=()=>{
      const rows=window[callback];
      if(!settled) Array.isArray(rows)?succeed(rows):fail("新浪历史报价响应格式无效");
    };
    script.onerror=event=>fail("新浪历史报价加载失败",new Error(String(event?.type||"script error")));
    document.head.appendChild(script);
  });
}
// 综合获取
async function fetchStockPrice(market, symbol, monthKey){
  const m=normalizedMarket(market);
  const code=tencentCode(market, symbol);
  // 当前月: 直接用实时价(最近交易日)
  if(isCurMonth(monthKey)){
    try{ return await tencentRealtime(code); }
    catch(e){ /* 落到历史逻辑 */ }
  }
  // 历史月统一走腾讯。美股在腾讯未覆盖目标月时，回退新浪 JSONP 日线。
  let out;
  if(m==="us"){
    try{ out=await tencentKline(code, monthKey); }
    catch(tencentError){
      try{ out=await sinaUsKline(symbol,monthKey); }
      catch(sinaError){
        throw new Error(`腾讯：${tencentError.message}；新浪：${sinaError.message}`);
      }
    }
  }else{
    out=await tencentKline(code, monthKey);
  }
  if(!(out && out.price>0)) throw new Error("未获取到有效收盘价");
  return out;
}
async function updateOnePrice(idx){

async function updateAllPrices(){
  const m=ledger.months[activeMonth];
  const targets=m.balance.map((r,i)=>({r,i})).filter(x=>x.r.auto&&x.r.symbol);
  if(!targets.length){ setStatus("本月没有可自动更新的股价条目"); return; }
  const results=[];
  for(const {r,i} of targets){
    try{ const {price,date,src}=await fetchStockPrice(r.market,r.symbol,activeMonth);
      if(!(price>0)) throw new Error("价格为0");
      results.push({i,price,status:"ok",priceAt:`${date}${src?"("+src+")":""}`});
    }catch(e){ results.push({i,status:"warn",error:e.message}); }
  }
  await transact(`批量更新股价（成功 ${results.filter(result=>result.status==="ok").length}/${targets.length}）`,()=>results.forEach(result=>{ const row=m.balance[result.i]; if(!row) throw new Error("资产在更新期间已变化"); if(result.status==="ok"){ row.price=result.price; row.priceStatus="ok"; row.priceAt=result.priceAt; row.manualPriceAt=null; } else row.priceStatus="warn"; }));
  const ok=results.filter(x=>x.status==="ok").length;
  const failed=results.filter(x=>x.status!=="ok");
  const reason=failed.length?`；失败：${failed.map(x=>`${targets.find(t=>t.i===x.i)?.r.name||"未知资产"}（${x.error||"无返回"}）`).join("；")}`:"";
  setStatus(`股价更新完成: 成功 ${ok}/${targets.length}${reason}`);
}

// ---------- 流水 → 资产负债 联动引擎 ----------
function flowAmount(f){ return Number(f.amount||0); }  // 保存时已算好(股票=数量×价格; 其它=直填)
function holdingFlowAmount(f){ return Number(f.holdingAmount!=null?f.holdingAmount:f.amount||0); }
function applyFlowToBalance(balance,f,sign){
  const byId=id=>balance.find(row=>row.id===id);
  const requireRow=id=>{ const row=byId(id); if(!row) throw new Error("流水引用的资产不存在，请先修复或删除该流水"); return row; };
  const addVal=(id,d)=>{ const row=requireRow(id); row.value=(Number(row.value)||0)+d; if(Number(row.value)!==0) delete row.inactive; };
  const addQty=(id,d)=>{ const row=requireRow(id); row.qty=(Number(row.qty)||0)+d; if(Number(row.qty)!==0) delete row.inactive; };
  const addHolding=(id,qty,amount,direction)=>{ const row=byId(id); if(!row) throw new Error("流水引用的资产不存在"); if(row.cls==="stock") addQty(id,qty*direction); else addVal(id,amount*direction); };
  const addCost=(id,d)=>{ const row=requireRow(id); row.costBasisCNY=Math.max(0,Number(row.costBasisCNY||0)+d); };
  const amt=flowAmount(f), toAmt=Number(f.toAmount!=null?f.toAmount:f.amount||0), holdAmt=holdingFlowAmount(f), q=Number(f.qty||0);
  switch(f.kind){
    case "income": {
      const target=requireRow(f.toAssetId);
      const quantityMode=target.cls==="stock"&&(f.incomeAssetMode==="quantity"||(Number.isFinite(Number(f.qty))&&Number.isFinite(Number(f.price))));
      if(quantityMode) addQty(f.toAssetId,q*sign); else addVal(f.toAssetId,+amt*sign);
      if(f.nonCashIncome===true) addCost(f.toAssetId,Number(f.costAddedCNY||0)*sign);
      break;
    }
    case "dividend": addVal(f.toAssetId,+amt*sign); break;
    case "expense": addVal(f.fromAssetId,-amt*sign); break;
    case "transfer": addVal(f.fromAssetId,-amt*sign); addVal(f.toAssetId,+toAmt*sign); break;
    case "buy": addVal(f.fromAssetId,-amt*sign); addHolding(f.toAssetId,q,holdAmt,+sign); addCost(f.toAssetId,Number(f.costAddedCNY||0)*sign); break;
    case "sell": addVal(f.toAssetId,+amt*sign); addHolding(f.fromAssetId,q,holdAmt,-sign); addCost(f.fromAssetId,-Number(f.costReductionCNY||0)*sign); break;
    case "repay": addVal(f.fromAssetId,-amt*sign); addVal(f.toAssetId,-amt*sign); break;
  }
}
// sign=+1 应用, -1 回滚
function applyFlow(f,sign){ applyFlowToBalance(ledger.months[activeMonth].balance,f,sign); }
// ---------- 跨月同步: 将某月期末同步为下月期初并重算 ----------
// 找到以 fromKey 为拷贝来源的下一月
function childMonthOf(fromKey){
  return Object.keys(ledger.months).filter(k=>ledger.months[k].copiedFrom===fromKey).sort()[0]||null;
}
function applyFlowOn(bal,f,sign){ applyFlowToBalance(bal,f,sign); }
// 基金和固定资产的 value 同时承载交易金额与人工期末估值。
// 同步前先从旧期初重放流水，抽取“流水无法解释的估值调整”；不能把旧期末 value
// 直接覆盖到新期初，否则卖出流水会在重放时被重复扣减。
function childValuationAdjustments(child,oldBal,flowAssetIds){
  if(!Array.isArray(child.opening)||!child.opening.length) return {};
  const oldById=new Map(oldBal.map(row=>[row.id,row]));
  const replay=child.opening.map(open=>({...oldById.get(open.id),...open}));
  const openingIds=new Set(replay.map(row=>row.id));
  oldBal.filter(row=>row.openedThisMonth&&flowAssetIds.has(row.id)&&!openingIds.has(row.id)).forEach(row=>{
    const base={...row};
    if(base.cls==="stock") base.qty=0;
    else base.value=0;
    base.costBasisCNY=0;
    replay.push(base);
  });
  (child.flows||[]).forEach(flow=>applyFlowOn(replay,flow,+1));
  const replayById=new Map(replay.map(row=>[row.id,row]));
  const out={};
  oldBal.forEach(row=>{
    if(row.cls!=="fund"&&row.cls!=="fixed") return;
    const expected=replayById.get(row.id);
    if(!expected) return;
    const adjustment=Number(row.value||0)-Number(expected.value||0);
    if(Number.isFinite(adjustment)&&Math.abs(adjustment)>0.000001) out[row.id]=adjustment;
  });
  return out;
}
// 重建 childKey 的期初(取自 parentKey 期末), 保留 child 自己的流水/价格/交易建仓资产, 再重算期末
function rebuildChildFromParent(parentKey, childKey){
  const parent=ledger.months[parentKey], child=ledger.months[childKey];
  const oldBal=child.balance;
  // child 自己"本月交易建仓"的资产(不来自父月)仅在仍有流水引用时保留。
  // 删除建仓流水后，遗留的 openedThisMonth 行不能再被同步时重复带入。
  const flowAssetIds=new Set();
  (child.flows||[]).forEach(f=>{
    if(f.fromAssetId) flowAssetIds.add(f.fromAssetId);
    if(f.toAssetId) flowAssetIds.add(f.toAssetId);
  });
  const valuationAdjustments=childValuationAdjustments(child,oldBal,flowAssetIds);
  const ownNew=oldBal.filter(r=>r.openedThisMonth&&flowAssetIds.has(r.id)).map(r=>{
    // 旧 balance 是本月期末；新建持仓作为期初时必须归零，再由本月流水重放。
    const c={...r};
    if(c.cls==="stock") c.qty=0;
    else c.value=0;
    c.costBasisCNY=0;
    return c;
  });
  // 继承资产 = 父月期末(剔除已清仓), 深拷贝作为期初。
  // 子月自己的价格、估值和自动更新状态属于月末估值，不应被来源月同步覆盖。
  const childOverrides={}; oldBal.forEach(r=>{
    childOverrides[r.id]={
      price:r.price,
      group:r.group,auto:r.auto,market:r.market,symbol:r.symbol,
      priceStatus:r.priceStatus,priceAt:r.priceAt,manualPriceAt:r.manualPriceAt
    };
  });
  const inherited = parent.balance.map(r=>{
    const c={...r}; delete c.openedThisMonth;
    const own=childOverrides[c.id];
    if(own){
      ["group","auto","market","symbol","priceStatus","priceAt","manualPriceAt"].forEach(key=>{ if(own[key]!==undefined) c[key]=own[key]; });
    }
    if(isClosed(c)) c.inactive=true; else delete c.inactive;
    return c;
  });
  // 新期初 = 继承 + child自建
  const opening = inherited.concat(ownNew.map(r=>({...r})));
  // 期初快照
  child.opening = opening.map(r=>({id:r.id,cls:r.cls,name:r.name,qty:r.qty,value:r.value,price:r.price}));
  // 期末 = 期初深拷贝, 再叠加 child 自己的流水
  const bal = opening.map(r=>({...r}));
  // 子月自己的价格属于子月期末；期初快照仍保留父月真实期末价格。
  bal.forEach(row=>{ const own=childOverrides[row.id]; if(own?.price!=null) row.price=own.price; });
  // 流水以资产 ID 引用，缺失引用会中止同步，不会静默指向其他资产。
  (child.flows||[]).forEach(f=>{
    applyFlowOn(bal, f, +1);
  });
  Object.entries(valuationAdjustments).forEach(([id,adjustment])=>{
    const row=bal.find(item=>item.id===id);
    if(row&&(row.cls==="fund"||row.cls==="fixed")) row.value=Number(row.value||0)+adjustment;
  });
  child.balance=bal;
  child.fxRates=child.fxRates||{...(parent.fxRates||{CNY:1})};
  child.sourceUpdatedAt=parent.updatedAt||new Date().toISOString();
  child.sourceRevision=Number(parent.revision||0);
  child.revision=Number(child.revision||0)+1;
  child.updatedAt=new Date().toISOString();
  appendMonthChange(child,`同步自 ${parentKey}（来源版本 ${child.sourceRevision}）`);
}
// 同步到下月(一级)
async function syncToNext(fromKey){
  const child=childMonthOf(fromKey);
  if(!child){ setStatus("没有以本月为来源的下一月"); return; }
  await transact("同步到下月",()=>rebuildChildFromParent(fromKey, child),{touch:false});
  setStatus(`已把 ${fromKey} 的期末同步到 ${child}`);
}
// 同步到后续所有月(沿拷贝链一路重建)
async function syncToAll(fromKey){
  let cur=fromKey, n=0;
  await transact("同步后续月份",()=>{
    while(true){ const child=childMonthOf(cur); if(!child) break; rebuildChildFromParent(cur,child); cur=child; n++; }
  },{touch:false});
  setStatus(n?`已同步到后续 ${n} 个月`:"没有后续月份");
}

// 持仓状态标识: 建仓(本月新开)/清仓(归零)/绿黄红灯(价格更新新鲜度)
function positionBadge(r){
  if(r.cls!=="stock"&&r.cls!=="fixed"&&r.cls!=="fund") return "";
  const closed = r.cls==="stock" ? Number(r.qty||0)===0 : Number(r.value||0)===0;
  if(closed) return `<span class="badge closed" title="已清仓，下月不再拷贝">清仓</span>`;
  if(r.cls==="stock"&&Number(r.qty||0)<0) return `<span class="badge short" title="负数量持仓">做空</span>`;
  if(r.openedThisMonth) return `<span class="badge opened" title="本月交易建仓">建仓</span>`;
  return "";
}
function isClosed(r){
  if(r.cls==="stock") return Number(r.qty||0)===0;
  if(r.cls==="fixed"||r.cls==="fund") return Number(r.value||0)===0;
  if(r.cls==="cash"||r.cls==="liability") return Number(r.value||0)===0;
  return false;
}
function findFlow(id){ const m=ledger.months[activeMonth]; const i=m.flows.findIndex(x=>x.id===id); return {m,i,f:m.flows[i]}; }

// ---------- 对账: 期末 = 期初 + 流水 + 价格更新, 找出不符合预期的变更 ----------
function reconcile(mKey){
  const m=ledger.months[mKey];
  if(!m.opening) return null;
  const openMap={}; m.opening.forEach(o=>openMap[o.id]=o);
  const dQty={}, dVal={};
  const bal=m.balance;
  const rowById=id=>bal.find(row=>row.id===id);
  const isFixed=id=>["fixed","fund"].includes(rowById(id)?.cls);
  (m.flows||[]).forEach(f=>{
    const a=Number(f.amount||0), t=Number(f.toAmount!=null?f.toAmount:f.amount||0), h=holdingFlowAmount(f), q=Number(f.qty||0);
    switch(f.kind){
      case "income":{ const id=f.toAssetId; if(id){ const quantityMode=rowById(id)?.cls==="stock"&&(f.incomeAssetMode==="quantity"||(Number.isFinite(Number(f.qty))&&Number.isFinite(Number(f.price)))); if(quantityMode) dQty[id]=(dQty[id]||0)+q; else dVal[id]=(dVal[id]||0)+a; } break; }
      case "dividend":{ const id=f.toAssetId; if(id) dVal[id]=(dVal[id]||0)+a; break; }
      case "expense": { const id=f.fromAssetId; if(id) dVal[id]=(dVal[id]||0)-a; break; }
      case "transfer":{ const i1=f.fromAssetId,i2=f.toAssetId; if(i1)dVal[i1]=(dVal[i1]||0)-a; if(i2)dVal[i2]=(dVal[i2]||0)+t; break; }
      case "buy":  { const c=f.fromAssetId; if(c)dVal[c]=(dVal[c]||0)-a;
                     const hold=f.toAssetId; if(hold){ if(isFixed(hold)) dVal[hold]=(dVal[hold]||0)+h; else dQty[hold]=(dQty[hold]||0)+q; } break; }
      case "sell": { const c=f.toAssetId; if(c)dVal[c]=(dVal[c]||0)+a;
                     const hold=f.fromAssetId; if(hold){ if(isFixed(hold)) dVal[hold]=(dVal[hold]||0)-h; else dQty[hold]=(dQty[hold]||0)-q; } break; }
      case "repay":{ const c=f.fromAssetId,l=f.toAssetId; if(c)dVal[c]=(dVal[c]||0)-a; if(l)dVal[l]=(dVal[l]||0)-a; break; }
    }
  });
  const EPS=0.01, issues=[];
  bal.forEach(r=>{
    const o=openMap[r.id];
    if(!o){ if(r.openedThisMonth) return; issues.push({msg:`新增资产「${r.name}」（期初不存在，且非交易建仓）`}); return; }
    if(r.cls==="stock"){
      const exp=Number(o.qty||0)+(dQty[r.id]||0);
      if(Math.abs(Number(r.qty||0)-exp)>EPS) issues.push({id:r.id,field:"qty",msg:`「${r.name}」数量 期望 ${fmt(exp)}，实际 ${fmt(r.qty)}（差 ${fmt(r.qty-exp)}）`});
    }else{
      if(r.cls==="fund") return;   // 基金价值靠手动更新, 不计入异常提示
      const exp=Number(o.value||0)+(dVal[r.id]||0);
      if(Math.abs(Number(r.value||0)-exp)>EPS){
        const tag=r.cls==="fixed"?"（固定资产手动更新）":"";
        issues.push({id:r.id,field:"value",msg:`「${r.name}」金额 期望 ${fmt(exp)}，实际 ${fmt(r.value)}（差 ${fmt(r.value-exp)}）${tag}`});
      }
    }
  });
  m.opening.forEach(o=>{ if(!bal.some(r=>r.id===o.id)) issues.push({msg:`资产「${o.name}」已被删除`}); });
  return { from:m.copiedFrom, issues };
}

async function deleteFlow(id){
  if(!confirm("删除该流水?其对资产负债表的影响将被回滚。")) return;
  await transact("删除流水",()=>{
    const {m,i,f}=findFlow(id); if(i<0) throw new Error("流水不存在");
    applyFlow(f,-1);
    m.flows.splice(i,1);
    removeUnreferencedOpenedAssets(m);
  });
}

function refreshExchangeRate(){
  const ft=FLOW_TYPES[$("fdKind").value];
  const holdSel=(ft.from==="holding"||ft.from==="asset")?$("fdFrom"):(ft.to==="holding"?$("fdTo"):null);
  const cashSel=ft.from==="cash"?$("fdFrom"):(ft.to==="cash"?$("fdTo"):null);
  const box=$("fd-fx");
  let baseCur, quoteCur;
  if(holdSel&&cashSel&&holdSel.value!=="__new__"&&cashSel.value!=="__new__"){
    const holding=assetById(holdSel.value), cash=assetById(cashSel.value);
    baseCur=holding?.currency||"CNY"; quoteCur=cash?.currency||"CNY";
  }else if(ft.from==="cash"&&ft.to==="cash"&&$("fdFrom")&&$("fdTo")){
    const from=assetById($("fdFrom").value), to=assetById($("fdTo").value);
    baseCur=from?.currency||"CNY"; quoteCur=to?.currency||"CNY";
  }else{ box.hidden=true; return; }
  if(ft.assetIncome) $("fdAmountLabel").textContent="资产收益金额（"+baseCur+"）";
  if(baseCur===quoteCur){ box.hidden=true; return; }
  const rate=fxRate(baseCur)/fxRate(quoteCur);
  $("fdFxLabel").textContent=`汇率（自动带入：1 ${baseCur} = ? ${quoteCur}）`;
  $("fdFxRate").value=rate.toFixed(6).replace(/0+$/,"").replace(/\.$/,"");
  box.hidden=false;
}

  const setDis=(id,dis)=>{ const el=$(id); if(el) el.disabled=dis; };
  if(!on){ setDis("fdQty",false); setDis("fdAmount",false); return; }
  if(kind==="repay"){

  }
  // 买入/卖出的清仓针对持有端
  const ft=FLOW_TYPES[kind];
  const sel = ft.from==="holding"?$("fdFrom"):(ft.to==="holding"?$("fdTo"):null);
  const r = sel&&sel.value!=="__new__"?assetById(sel.value):null;

    else { $("fdAmount").value=Number(r.value||0); setDis("fdAmount",true); }
  }
}

function buildFlowDraft(){
  const m=ledger.months[activeMonth], kind=$("fdKind").value, ft=FLOW_TYPES[kind];
  if(!ft) throw new Error("请选择有效流水类型");
  const readSide=(side,selId)=>{
    const el=$(selId);
    if(side==="free") return {text:textValue(el?.value,160)};
    if(!el) throw new Error("缺少可选资产，请先添加对应账户");
    if(el.value==="__new__") return {isNew:true};
    const asset=assetById(el.value);
    if(!asset) throw new Error("所选资产已不存在，请重新选择");
    return {asset};
  };
  const from=readSide(ft.from,"fdFrom"), to=readSide(ft.to,"fdTo");
  const holdIsNew=(ft.to==="holding"&&to.isNew)||(ft.from==="holding"&&from.isNew)||(ft.to==="asset"&&ft.newAsset&&to.isNew);
  let newAsset=null;
  if(holdIsNew){
    const name=textValue($("niName").value,80), cls=$("niCls").value;
    if(!name) throw new Error("请填写新建资产的项目名称");
    if(!["stock","fund","cash","fixed"].includes(cls)) throw new Error("新建资产类型无效");
    newAsset={id:uid("a"),cls,group:textValue($("niGroup").value,80)||"未分组",name,account:textValue($("niAccount").value,80),currency:textValue($("niCurrency").value,12)||"CNY",openedThisMonth:true};
    if(cls==="stock"){
      newAsset.qty=0; newAsset.price=Number($("fdPrice").value);
      if(!Number.isFinite(newAsset.price)||newAsset.price<=0) throw new Error("请填写有效价格");
      newAsset.auto=$("niAuto").checked;
      if(newAsset.auto){ newAsset.market=$("niMarket").value; newAsset.symbol=textValue($("niSymbol").value,30); }
    }else{ newAsset.value=0; if(cls==="fixed") newAsset.account=""; }
    if(ft.to==="holding"||ft.to==="asset") to.asset=newAsset; else from.asset=newAsset;
  }
  const hold=ft.from==="holding"||ft.from==="asset"?from.asset:((ft.to==="holding"||ft.to==="asset"&&ft.newAsset)?to.asset:null);
  const usesQtyPrice=flowUsesQtyPrice();
  const date=$("fdDate").value||(activeMonth+"-01");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date.slice(0,7)!==activeMonth) throw new Error("流水日期必须属于当前月份");
  if(kind==="transfer"&&from.asset?.id===to.asset?.id) throw new Error("转出与转入账户不能相同");
  const rec={kind,date,note:textValue($("fdNote").value,240)};
  if(ft.subcat) rec.subcat=textValue($("fdSubcat").value,80);
  if(usesQtyPrice){
    rec.qty=Number($("fdQty").value); rec.price=Number($("fdPrice").value); rec.amount=rec.qty*rec.price;
    if(!Number.isFinite(rec.qty)||!Number.isFinite(rec.price)||rec.qty===0||rec.price<=0) throw new Error("请填写有效数量和价格");
  }else{
    rec.amount=parseArithmetic($("fdAmount").value,"金额");
    if(!Number.isFinite(rec.amount)||rec.amount===0) throw new Error("请填写有效金额");
  }
  if(ft.from==="free") rec.fromText=from.text; else setFlowAsset(rec,"from",from.asset);
  if(ft.to==="free") rec.toText=to.text; else setFlowAsset(rec,"to",to.asset);
  if(kind==="income"){
    const editId=$("flowDialog").dataset.edit;
    const original=editId?m.flows.find(flow=>flow.id===editId):null;
    const legacyUnmarked=original&&original.kind==="income"&&original.toAssetId===to.asset?.id&&original.nonCashIncome==null&&original.incomeAssetMode==null&&original.qty==null;
    if(!legacyUnmarked){
      rec.nonCashIncome=to.asset?.cls!=="cash";
      rec.incomeAssetMode=usesQtyPrice?"quantity":"value";
    }
  }
  const holdCur=hold?.currency||null;
  const cash=ft.from==="cash"?from.asset:(ft.to==="cash"?to.asset:null);
  const cashCur=cash?.currency||null;
  if(holdCur&&cashCur&&holdCur!==cashCur){
    const rate=Number($("fdFxRate").value);
    if(!Number.isFinite(rate)||rate<=0) throw new Error("请填写有效换汇汇率");
    rec.holdingAmount=rec.amount; rec.amount=rec.holdingAmount*rate;
    rec.fxRate=rate; rec.holdingCurrency=holdCur; rec.currency=cashCur;
  }else if(ft.from==="cash"&&ft.to==="cash"&&from.asset.currency!==to.asset.currency){
    const rate=Number($("fdFxRate").value);
    if(!Number.isFinite(rate)||rate<=0) throw new Error("请填写有效换汇汇率");
    rec.toAmount=rec.amount*rate; rec.fxRate=rate; rec.toCurrency=to.asset.currency; rec.currency=from.asset.currency;
  }else rec.currency=(from.asset||to.asset)?.currency||"CNY";
  return {rec,newAsset};
}
function refreshFlowCostMetadata(month,rec){
  delete rec.costAddedCNY; delete rec.costReductionCNY; delete rec.realizedPnlCNY;
  if(rec.kind==="income"&&rec.nonCashIncome===true){
    const target=assetByFlow(month,rec,"to");
    if(target&&target.cls!=="cash") rec.costAddedCNY=Math.abs(flowCNY(rec,activeMonth));
  }else if(rec.kind==="buy"){
    const hold=assetByFlow(month,rec,"to");
    if(hold) rec.costAddedCNY=flowCNY(rec,activeMonth);
  }else if(rec.kind==="sell"){
    const hold=assetByFlow(month,rec,"from");
    if(!hold) return;
    const held=hold.cls==="stock"?Math.abs(Number(hold.qty||0)):Math.abs(Number(hold.value||0));
    const sold=hold.cls==="stock"?Math.abs(Number(rec.qty||0)):Math.abs(Number(rec.holdingAmount!=null?rec.holdingAmount:rec.amount||0));
    const ratio=held>0?Math.min(1,sold/held):0;
    rec.costReductionCNY=Number(hold.costBasisCNY||0)*ratio;
    rec.realizedPnlCNY=flowCNY(rec,activeMonth)-rec.costReductionCNY;
  }
}

// 平滑折线路径(Catmull-Rom → 贝塞尔)
function smoothPath(pts){
  if(pts.length<2) return pts.length?`M${pts[0][0]},${pts[0][1]}`:"";
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`;
  }
  return d;
}
// 资产规模按月展示变动值；窗口首月仍相较其真实上月，整个账本首月记为 0。
function stackedChart(keys){
  const allKeys=Object.keys(ledger.months).sort();
  const groupSet={};
  const data=keys.map(k=>{
    const priorIndex=allKeys.indexOf(k)-1;
    const prevKey=priorIndex>=0?allKeys[priorIndex]:null;
    const groups=monthGroupTotals(k), prevGroups=prevKey?monthGroupTotals(prevKey):{};
    Object.keys(groups).forEach(n=>groupSet[n]=true);
    Object.keys(prevGroups).forEach(n=>groupSet[n]=true);
    return {m:k,groups,prevGroups,isBaseline:!prevKey};
  });
  const gNames=Object.keys(groupSet).sort((a,b)=>{
    const last=data[data.length-1].groups;
    return Math.abs(last[b]||0)-Math.abs(last[a]||0);
  });
  data.forEach(d=>{
    d.deltas={};
    gNames.forEach(gn=>d.deltas[gn]=d.isBaseline?0:(d.groups[gn]||0)-(d.prevGroups[gn]||0));
  });
  const changeCell=value=>{
    const tone=value>0?"pos":value<0?"neg":"zero";
    return `<span class="amount change-cell ${tone}">${value>0?"+":""}${fmtTrend(value)}</span>`;
  };
  const rows=data.map(d=>`<tr><td class="num">${d.m}</td>${gNames.map(gn=>`<td>${changeCell(d.deltas[gn])}</td>`).join("")}</tr>`).join("");
  const openingGroups=data[0].isBaseline ? data[0].groups : data[0].prevGroups;
  const openingKey=data[0].isBaseline ? keys[0] : allKeys[allKeys.indexOf(keys[0])-1];
  const openingMonthTotals=monthTotals(openingKey), openingAssets=openingMonthTotals.assets, openingLiabs=Math.abs(openingMonthTotals.liab);
  const openingTotals=gNames.map(gn=>{
    const value=openingGroups[gn]||0;
    const denominator=value<0?openingLiabs:openingAssets;
    const share=denominator?Math.abs(value)/denominator*100:0;
    return `<td><div class="trend-total"><span class="amount ${value>0?"pos":value<0?"neg":""}">${value>0?"+":""}${fmtTrend(value)}</span><small>${share.toFixed(1)}% ${value<0?"总负债":"总资产"}</small></div></td>`;
  }).join("");
  const finalGroups=data[data.length-1].groups;
  const finalMonthTotals=monthTotals(keys[keys.length-1]), finalAssets=finalMonthTotals.assets, finalLiabs=Math.abs(finalMonthTotals.liab);
  const totals=gNames.map(gn=>{
    const value=finalGroups[gn]||0;
    const denominator=value<0?finalLiabs:finalAssets;
    const share=denominator?Math.abs(value)/denominator*100:0;
    return `<td><div class="trend-total"><span class="amount ${value>0?"pos":value<0?"neg":""}">${value>0?"+":""}${fmtTrend(value)}</span><small>${share.toFixed(1)}% ${value<0?"总负债":"总资产"}</small></div></td>`;
  }).join("");
  const heads=gNames.map((gn,gi)=>`<th><span class="group-head"><i style="background:${palette(gi)}"></i>${escapeHTML(gn)}</span></th>`).join("");
  return `<div class="chart-block"><div class="chart-title">资产规模趋势</div>
    <div class="hint">单元格为相较上月的期末规模变动；期初和期末汇总中，资产占比以总资产为分母，负债占比以总负债为分母。</div>
    <div class="trend-table-wrap"><table class="trend-table"><thead><tr><th>月份</th>${heads}</tr></thead>
      <tbody><tr class="trend-opening-row"><td>期初汇总</td>${openingTotals}</tr>${rows}<tr class="trend-total-row"><td>期末汇总</td>${totals}</tr></tbody></table></div>
  </div>`;
}
function compactProfitContributions(rawNames,rawData,maxVisible=6){
  const totals={};
  rawData.forEach(d=>rawNames.forEach(name=>totals[name]=(totals[name]||0)+(d.deltas[name]||0)));
  const pinned=["收入","支出"].filter(name=>Math.abs(totals[name]||0)>0.01);
  const remaining=rawNames.filter(name=>!pinned.includes(name)&&Math.abs(totals[name]||0)>0.01)
    .sort((a,b)=>Math.abs(totals[b])-Math.abs(totals[a]));
  const kept=[...pinned,...remaining.slice(0,Math.max(0,maxVisible-pinned.length))];
  const hidden=rawNames.filter(name=>!kept.includes(name));
  const data=rawData.map(d=>{
    const deltas={};
    kept.forEach(name=>deltas[name]=d.deltas[name]||0);
    const other=hidden.reduce((sum,name)=>sum+(d.deltas[name]||0),0);
    if(Math.abs(other)>0.01) deltas["其他贡献"]=other;
    return {...d,deltas};
  });
  const names=[...kept];
  if(data.some(d=>Math.abs(d.deltas["其他贡献"]||0)>0.01)) names.push("其他贡献");
  return {names,data};
}
function profitColor(name,index){
  if(name==="收入") return "var(--green)";
  if(name==="支出") return "var(--red)";
  if(name==="其他贡献"||name==="未解释调整") return "var(--muted)";
  return palette(index);
}
function profitSummaryCards(names,data,colorFor){
  const totals={};
  data.forEach(d=>names.forEach(name=>totals[name]=(totals[name]||0)+(d.deltas[name]||0)));
  const rows=Object.entries(totals).filter(([,value])=>Math.abs(value)>0.01)
    .sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  if(!rows.length) return "";
  const cards=rows.map(([name,value])=>{
    const tone=value>0?"pos":value<0?"neg":"neutral";
    const label=name.startsWith("资产·")?name.slice(3):name;
    const index=names.indexOf(name);
    return `<div class="card profit-card ${tone}"><div class="label"><i class="profit-swatch" style="background:${colorFor(name,index)}"></i>${escapeHTML(label)}</div><div class="profit-value num ${tone==="neutral"?"":tone}">${value>0?"+":""}${amount(value)}</div></div>`;
  }).join("");
  return `<div class="profit-summary"><div class="cards">${cards}</div></div>`;
}
// 净资产盈亏归因：投资分组按期末价值变化扣除买入成本、加回卖出成交额和资产收益。
function profitChart(keys){
  const W=Math.max(520,keys.length*72), H=160, PL=8, PR=8, PT=14, PB=22;
  const allKeys=Object.keys(ledger.months).sort(), categorySet={};
  const rawData=keys.map((k,index)=>{
    const priorIndex=allKeys.indexOf(k)-1;
    const prevKey=index>0?keys[index-1]:(priorIndex>=0?allKeys[priorIndex]:null);
    const d=profitAttribution(k,prevKey);
    Object.keys(d.deltas).forEach(name=>categorySet[name]=true);
    return d;
  });
  const rawNames=Object.keys(categorySet);
  const compact=compactProfitContributions(rawNames,rawData);
  const names=compact.names, data=compact.data;
  const colorFor=profitColor;
  const maxV=Math.max(1,...data.map(d=>{
    const values=names.map(name=>d.deltas[name]||0);
    return Math.max(values.reduce((sum,v)=>sum+Math.max(0,v),0),-values.reduce((sum,v)=>sum+Math.min(0,v),0),Math.abs(d.netDelta));
  }));
  const x=i=>keys.length<=1?W/2:PL+i*(W-PL-PR)/(keys.length-1);
  const zeroY=PT+(H-PT-PB)/2, scale=(H-PT-PB)/2/maxV;
  const bw=Math.max(12,Math.min(38,(W-PL-PR)/keys.length*.58));
  let bars="";
  data.forEach((d,i)=>{
    let pos=0,neg=0;
    names.forEach((name,ni)=>{
      const value=d.deltas[name]||0; if(!value) return;
      const h=Math.abs(value)*scale, y=value>0?zeroY-(pos+value)*scale:zeroY+neg*scale;
      if(value>0) pos+=value; else neg+=Math.abs(value);
      bars+=`<rect x="${x(i)-bw/2}" y="${y}" width="${bw}" height="${h}" rx="2" fill="${colorFor(name,ni)}" fill-opacity=".86"><title>${escapeHTML(name)} ${value>0?"+":""}${fmtMoney(value)}</title></rect>`;
    });
  });
  const line=smoothPath(data.map((d,i)=>[x(i),zeroY-d.netDelta*scale]));
  const dots=data.map((d,i)=>`<circle cx="${x(i)}" cy="${zeroY-d.netDelta*scale}" r="2.6" fill="var(--bg)" stroke="var(--text)" stroke-width="1.5"/>`).join("");
  const hover=keys.map((k,i)=>{
    const cw=(W-PL-PR)/Math.max(1,keys.length);
    return `<rect class="profit-hover-col" x="${x(i)-cw/2}" y="0" width="${cw}" height="${H}" fill="transparent" data-i="${i}"/>`;
  }).join("");
  window.__profitHover={data,names,colorFor};
  const summary=profitSummaryCards(names,data,colorFor);
  return `<div class="chart-block profit-analysis"><div class="profit-analysis-head"><div class="chart-title">盈亏趋势</div><span class="profit-line-key"><i></i>净资产变动</span></div>
    ${summary}
    <div class="svg-wrap" style="position:relative"><svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${PL}" y1="${zeroY}" x2="${W-PR}" y2="${zeroY}" class="zero-line"/>
      ${bars}
      <path d="${line}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      ${dots}
      <line class="hover-line" x1="0" y1="0" x2="0" y2="${H}" stroke="var(--text)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>
      ${hover}
    </svg><div class="chart-tip" style="display:none"></div></div>${xAxisLabels(keys)}</div>`;
}

// ---------- 账本 加载/创建/打开 (严格文件绑定) ----------
async function verifyPermission(handle, write){
  const opts={mode: write?"readwrite":"read"};
  if((await handle.queryPermission(opts))==="granted") return true;
  if((await handle.requestPermission(opts))==="granted") return true;
  return false;
}
async function useHandle(handle, {isNew, directory}={}){
  let nextLedger=ledger, nextEncryptionKey=encryptionKey, nextEncryptionMeta=encryptionMeta;
  if(!isNew){
    const file=await handle.getFile();
    let obj=JSON.parse(await file.text());
    nextEncryptionKey=null; nextEncryptionMeta=null;
    if(obj.schema==="nimble-ledger-encrypted-v1"){
      const password=await requestPassword({title:`打开加密账本：${file.name}`,hint:"请输入此账本的密码以解锁本地 JSON"});
      if(password==null){ const e=new Error("已取消输入密码"); e.name="AbortError"; throw e; }
      const unlocked=await unlockLedger(obj,password);
      obj=unlocked.data; nextEncryptionKey=unlocked.key; nextEncryptionMeta=unlocked.meta;
    }
    nextLedger=migrateLedger(obj);
  }
  // 文件解析、密码验证和结构迁移全部成功后，才切换当前运行状态。
  ledger=nextLedger;
  encryptionKey=nextEncryptionKey;
  encryptionMeta=nextEncryptionMeta;
  fileHandle=handle;
  directoryHandle=directory||null;
  demoMode=false;
  activeMonth=null; balanceEditMode=false; flowEditMode=false;
  registry[ledger.name]=handle;
  await idbSet(ledger.name, handle);      // 句柄持久化,便于刷新后重开
  if(directoryHandle) await idbSet(`dir:${ledger.name}`,directoryHandle);
  localStorage.setItem(LS_ACTIVE, ledger.name);
  if(isNew) await persist();
  renderAll();
}

async function openFromFile(){
  if(!HAS_FS){ $("fallbackJsonInput").click(); return; }
  try{
    const opts={
      id:"family-ledger-open",
      types:[{description:"账本 JSON",accept:{"application/json":[".json"]}}]
    };
    // 有当前账本时从其所在目录开始；否则由浏览器恢复上次导入目录。
    if(fileHandle) opts.startIn=fileHandle;
    const [h] = await window.showOpenFilePicker(opts);
    if(!(await verifyPermission(h,true))){ alert("未授予文件读写权限"); return; }
    await useHandle(h,{isNew:false});
    setStatus("已打开账本: "+ledger.name);
  }catch(e){ if(e.name!=="AbortError") alert("打开失败: "+e.message); }
}

async function importFallbackFile(file){
  try{
    let obj=JSON.parse(await file.text());
    encryptionKey=null; encryptionMeta=null;
    if(obj.schema==="nimble-ledger-encrypted-v1"){
      const password=await requestPassword({title:`打开加密账本：${file.name}`,hint:"请输入此账本的密码以解锁本地 JSON"});
      if(password==null) return;
      const unlocked=await unlockLedger(obj,password);
      obj=unlocked.data; encryptionKey=unlocked.key; encryptionMeta=unlocked.meta;
    }
    ledger=migrateLedger(obj); fileHandle=null; directoryHandle=null; demoMode=false; activeMonth=null; balanceEditMode=false; flowEditMode=false;
    renderAll();
    setStatus(`已导入 ${file.name}；请使用「备份」下载编辑后的 JSON`);
  }catch(e){ alert("导入失败: "+e.message); }
}

async function loadDemoLedger(){
  try{
    const res=await fetch(new URL("./demo-ledger.json",location.href),{cache:"no-store"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const obj=await res.json();
    ledger=migrateLedger(obj); fileHandle=null; directoryHandle=null; encryptionKey=null; encryptionMeta=null;
    demoMode=true; activeMonth=Object.keys(obj.months).sort().at(-1)||null; balanceEditMode=false; flowEditMode=false;
    renderAll();
    setStatus("正在体验示例账本；编辑后请下载示例副本或新建自己的账本");
    return true;
  }catch(e){
    console.warn("示例账本加载失败",e);
    return false;
  }
}

// ---------- 账本管理 ----------
async function switchLedger(name){
  if(!name || name===ledger?.name) return;
  const h=registry[name];
  if(!h){ alert("找不到该账本的文件句柄，请重新打开 JSON 文件"); renderLedgerManager(); return; }
  try{
    if(!(await verifyPermission(h,true))){ alert("未授予文件读写权限"); renderLedgerManager(); return; }
    await useHandle(h,{isNew:false});
    setStatus("已切换到: "+name);
    $("ledgerManagerDialog").hidden=true;
  }catch(e){ alert("切换失败: "+e.message); renderLedgerManager(); }
}
function openCreateDialog(){
  $("newName").value="";
  $("newPassword").value=""; $("newPasswordConfirm").value="";
  $("fsUnsupported").hidden = HAS_FS;
  $("createDialog").hidden=false;
}
async function removeLedgerRecord(name){
  if(!registry[name]) return;
  if(!confirm(`删除账本「${name}」的本机记录？\n不会删除磁盘上的 JSON 文件。`)) return;
  const isCurrent=ledger?.name===name;
  delete registry[name]; await idbDel(name);
  if(isCurrent){
    ledger=null; fileHandle=null; directoryHandle=null; demoMode=false; activeMonth=null; balanceEditMode=false; flowEditMode=false;
    encryptionKey=null; encryptionMeta=null;
    localStorage.removeItem(LS_ACTIVE);
  }
  await idbDel(`dir:${name}`);
  renderAll();
  if(isCurrent && /^https?:$/.test(location.protocol) && !Object.keys(registry).length && await loadDemoLedger()) return;
  setStatus(isCurrent?`已关闭并移除账本记录: ${name}`:`已移除账本记录: ${name}`);
}
async function renameCurrentLedger(){
  if(!ledger) return;
  const oldName=ledger.name;
  const name=(prompt("账本名称（不会修改磁盘文件名）:",oldName)||"").trim();
  if(!name||name===oldName) return;
  if(registry[name]){ alert("已有同名账本，请使用其他名称"); return; }
  ledger.name=name;
  try{
    if(fileHandle) await persist();
  }catch(error){
    ledger.name=oldName;
    renderAll();
    alert("重命名失败，原名称已保留："+error.message);
    return;
  }
  delete registry[oldName]; await idbDel(oldName); await idbDel(`dir:${oldName}`);
  if(fileHandle){
    registry[name]=fileHandle; await idbSet(name,fileHandle);
    if(directoryHandle) await idbSet(`dir:${name}`,directoryHandle);
  }
  localStorage.setItem(LS_ACTIVE,name);
  renderAll(); renderLedgerManager();
  setStatus("已重命名账本: "+name);
}
async function setLedgerPassword(){
  if(!ledger) return;
  if(encryptionKey){
    const oldPassword=await requestPassword({title:`验证当前密码：${ledger.name}`,hint:"修改或取消密码保护前，请先输入当前密码"});
    if(oldPassword==null) return;
    try{
      const wrapper=fileHandle ? JSON.parse(await (await fileHandle.getFile()).text()) : await serializeLedger();
      await unlockLedger(wrapper,oldPassword);
    }catch(e){ alert("当前密码不正确"); return; }
  }
  const password=await requestPassword({
    title:`${encryptionKey?"修改密码保护":"设置密码保护"}：${ledger.name}`,
    hint:encryptionKey?"留空并确认将取消密码保护，账本恢复为明文 JSON。":"可留空以保持明文 JSON。",
    confirm:true
  });
  if(password==null) return;
  const previousKey=encryptionKey, previousMeta=encryptionMeta;
  try{
    if(!password){
      if(!encryptionKey){ setStatus("账本保持明文存储"); return; }
      encryptionKey=null; encryptionMeta=null;
      await persist(); renderLedgerManager();
      setStatus("已取消密码保护，账本已恢复为明文 JSON");
      return;
    }
    const protectedData=await protectLedger(ledger,password);
    encryptionKey=protectedData.key; encryptionMeta=protectedData.meta;
    await persist(); renderLedgerManager();
    setStatus("已更新账本密码");
  }catch(e){
    encryptionKey=previousKey; encryptionMeta=previousMeta;
    renderLedgerManager();
    alert("设置密码失败，原密码状态已保留: "+e.message);
  }
}
async function backupCurrentLedger(){
  if(!ledger){ alert("请先打开账本"); return; }
  const stamp=new Date().toISOString().replace(/[:.]/g,"-");
  const blob=new Blob([JSON.stringify(await serializeLedger(),null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`${ledger.name}_backup_${stamp}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),0);
  setStatus("已下载备份: "+a.download);
}
// ---------- 事件绑定 ----------
$("btnLedgerManager").addEventListener("click",()=>{ renderLedgerManager(); $("ledgerManagerDialog").hidden=false; });
$("btnBackup").addEventListener("click",backupCurrentLedger);
$("fallbackJsonInput").addEventListener("change",async e=>{
  const file=e.target.files?.[0]; e.target.value="";
  if(file) await importFallbackFile(file);
});
$("btnManagerDone").addEventListener("click",()=>$("ledgerManagerDialog").hidden=true);
$("btnManagerCreate").addEventListener("click",()=>{ $("ledgerManagerDialog").hidden=true; openCreateDialog(); });
$("btnManagerOpen").addEventListener("click",async()=>{ $("ledgerManagerDialog").hidden=true; await openFromFile(); });
$("btnManagerRename").addEventListener("click",renameCurrentLedger);
$("btnManagerPassword").addEventListener("click",setLedgerPassword);
$("ledgerManagerList").addEventListener("click",e=>{
  const remove=e.target.closest("[data-ledger-remove]"); if(remove){ removeLedgerRecord(remove.dataset.ledgerRemove); return; }
  const switcher=e.target.closest("[data-ledger-switch]"); if(switcher) switchLedger(switcher.dataset.ledgerSwitch);
});

// ---------- PWA：仅缓存程序资源，不保存或上传用户账本 ----------
let deferredInstallPrompt=null;
function isMobileDevice(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||navigator.maxTouchPoints>1; }
function showInstallGuide(){
  const isiOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
  $("installGuideContent").innerHTML=isiOS
    ? `<p>请点击浏览器底部或顶部的“分享”按钮，然后选择“添加到主屏幕”。</p><p>添加后可从桌面以独立应用方式打开 Wealth Tracker。</p>`
    : `<p>请在浏览器菜单中选择“安装应用”或“添加到主屏幕”。</p><p>添加后可从桌面以独立应用方式打开 Wealth Tracker。</p>`;
  $("installGuideDialog").hidden=false;
}
function initPWA(){
  if(isMobileDevice()&&!window.matchMedia("(display-mode: standalone)").matches) $("btnInstallApp").hidden=false;
  if(!window.isSecureContext||!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("./service-worker.js?v=20260802-v23",{scope:"./"}).then(reg=>{
    reg.addEventListener("updatefound",()=>{
      const worker=reg.installing;
      if(!worker) return;
      worker.addEventListener("statechange",()=>{
        if(worker.state==="installed"&&navigator.serviceWorker.controller)
          setStatus("发现新版本，刷新页面后生效");
      });
    });
  }).catch(error=>console.warn("PWA 注册失败",error));
}
window.addEventListener("beforeinstallprompt",event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
  $("btnInstallApp").hidden=false;
});
window.addEventListener("appinstalled",()=>{
  deferredInstallPrompt=null;
  $("btnInstallApp").hidden=true;
  setStatus("Wealth Tracker 已安装为本机应用");
});
$("btnInstallApp").addEventListener("click",async()=>{
  if(!deferredInstallPrompt){ showInstallGuide(); return; }
  await deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  $("btnInstallApp").hidden=true;
});
$("btnInstallGuideDone").addEventListener("click",()=>{ $("installGuideDialog").hidden=true; });

// 新建账本对话框
$("btnCreateCancel").addEventListener("click",()=>{ $("createDialog").hidden=true; });
$("btnCreateOk").addEventListener("click",async()=>{
  const name=($("newName").value||"").trim();
  const password=$("newPassword").value, confirmPassword=$("newPasswordConfirm").value;
  if(!name){ alert("请输入账本名称"); return; }
  if(password!==confirmPassword){ alert("两次输入的密码不一致"); return; }
  if(!HAS_FS){
    ledger=newLedger(name); fileHandle=null; directoryHandle=null; demoMode=false; encryptionKey=null; encryptionMeta=null;
    if(password){
      try{ const protectedData=await protectLedger(ledger,password); encryptionKey=protectedData.key; encryptionMeta=protectedData.meta; }
      catch(e){ ledger=null; alert("无法设置密码: "+e.message); return; }
    }
    $("createDialog").hidden=true; renderAll(); await backupCurrentLedger();
    setStatus("已创建账本；当前浏览器不支持自动写回，请下载并保存 JSON");
    return;
  }
  let handle, directory;
  const safeName=name.replaceAll("/","_").replaceAll("\\","_").replace(/[<>:"|?*\u0000-\u001F]/g,"_").trim()||"ledger";
  const filename=safeName+"_ledger_data.json";
  try{
    directory = await window.showDirectoryPicker({id:"wealth-tracker-directory",mode:"readwrite"});
    try{
      await directory.getFileHandle(filename);
      alert(`所选目录中已存在 ${filename}。为避免覆盖账本，请修改名称或选择其他目录。`);
      return;
    }catch(e){ if(e.name!=="NotFoundError") throw e; }
    handle = await directory.getFileHandle(filename,{create:true});
  }catch(e){ if(e.name==="AbortError") return; alert("选择本地目录失败: "+e.message); return; }
  if(!(await verifyPermission(handle,true))){ alert("未授予文件写入权限，创建失败"); return; }
  ledger = newLedger(name); demoMode=false; encryptionKey=null; encryptionMeta=null;
  if(password){
    try{ const protectedData=await protectLedger(ledger,password); encryptionKey=protectedData.key; encryptionMeta=protectedData.meta; }
    catch(e){ ledger=null; alert("无法设置密码: "+e.message); return; }
  }
  try{
    await useHandle(handle,{isNew:true,directory});
    $("createDialog").hidden=true;
    setStatus(`已创建账本：${directory.name}/${handle.name}，后续修改将自动保存`);
  }catch(e){ ledger=null; fileHandle=null; directoryHandle=null; alert("创建失败: "+e.message); }
});

// ---------- 启动 ----------
(async function boot(){
  initPWA();
  loadGuide();
  renderAll();
  const isWeb=/^https?:$/.test(location.protocol);
  if(!HAS_FS){
    if(isWeb && await loadDemoLedger()) return;
    setStatus("当前为导入模式：可打开 JSON 并下载备份；Chrome/Edge 的 HTTPS 页面支持自动写回本地文件");
    return;
  }
  try{
    const saved = await idbGetAll();       // 恢复已知账本句柄
    Object.entries(saved).forEach(([name,h])=>{ if(!name.startsWith("dir:")) registry[name]=h; });
    renderLedgerManager();
    const last = localStorage.getItem(LS_ACTIVE);
    if(last && registry[last]){
      const h=registry[last];
      // 刷新后需用户再次授权(浏览器安全策略); 授权成功则自动载入
      if((await h.queryPermission({mode:"readwrite"}))==="granted"){
        await useHandle(h,{isNew:false,directory:saved[`dir:${last}`]});
        setStatus("已恢复账本: "+last);
        return;
      }
    }
  }catch(e){ console.warn("恢复失败",e); }
  if(!ledger && isWeb && !Object.keys(registry).length && await loadDemoLedger()) return;
  if(!ledger) setStatus("请「＋ 新建」或「打开文件…」开始");
})();
</script>
