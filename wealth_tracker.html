<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#faf7f0" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title id="pageTitle">WEALTH TRACKER</title>
<link rel="icon" type="image/svg+xml" href="./wealth_tracker.svg" />
<link rel="apple-touch-icon" sizes="180x180" href="./wealth_tracker-180.png?v=20260802-v23" />
<link rel="manifest" href="./manifest.webmanifest?v=20260802-v23" />
<style>
:root{
  --bg:#efe9db; --panel:#faf7f0; --panel2:#f4efe3; --line:#e0d7c4;
  --text:#33302a; --muted:#8c8372; --accent:#2f4858; --green:#2e6f4e;
  --red:#a6392f; --amber:#b8923f;
  --serif:"Georgia","Times New Roman","Songti SC","STSong",serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;font-size:18px;font-family:var(--serif);letter-spacing:.5px;display:flex;align-items:center;gap:8px;line-height:1.2}
.brand-copy{display:flex;flex-direction:column}
.brand-icon{width:28px;height:28px;flex:none}
.brand-kicker{font-family:-apple-system,sans-serif;font-size:9px;letter-spacing:2px;color:var(--muted);font-weight:600}
.ledger-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ledger-ctrl:has(.guide[open]){flex-basis:100%;justify-content:flex-end}
.ledger-ctrl>button,.guide summary{min-height:38px;padding:8px 14px;font-size:14px;font-weight:600}
.ledger-ctrl label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
select,input,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:6px 11px;font-size:13px;outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,72,88,.15)}
button{cursor:pointer;transition:all .18s ease}
button:hover{border-color:var(--accent);background:#ece5d5}
button.primary{background:var(--accent);border-color:var(--accent);color:#faf7f0}
button.primary:hover{filter:brightness(1.12)}
button.danger:hover{border-color:var(--red);color:var(--red);background:rgba(166,57,47,.08)}
.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.manager-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.manager-current{padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.manager-current b{color:var(--text)}
.manager-section{margin-top:16px}
.manager-list{border-top:1px solid var(--line);max-height:260px;overflow:auto}
.ledger-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.ledger-switch{min-width:0;flex:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 2px;background:transparent;border:0;border-radius:0;text-align:left}
.ledger-switch:hover{background:transparent;color:var(--accent)}
.ledger-item .ledger-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ledger-item .ledger-state{font-size:11px;color:var(--muted);white-space:nowrap}
.guide{font-size:13px}
.guide summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--text);user-select:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary:hover{border-color:var(--accent);background:#ece5d5}
.guide[open]{display:flex;flex:0 0 100%;flex-direction:column;align-items:center;order:2}
.guide[open] summary{align-self:flex-end;margin:4px 0 12px;color:var(--text)}
.guide-content{width:min(920px,100%);margin:0 auto;padding:18px 22px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;line-height:1.7}
.guide-content h3{margin:14px 0 5px;font-size:14px}
.guide-content h3:first-child{margin-top:0}
.guide-content p{margin:5px 0}
.guide-content ol,.guide-content ul{margin:5px 0;padding-left:22px}
.guide-content code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:rgba(255,255,255,.55);padding:1px 4px;border-radius:3px}
.badge.price-status-btn{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;margin-left:3px;padding:0;border-radius:50%;background:transparent;font:inherit;line-height:1;vertical-align:middle}
.badge.price-status-btn:hover{background:rgba(184,146,63,.12);filter:none}
.badge.price-status-btn.warn:hover{border-color:var(--amber);color:var(--amber)}
.badge.price-status-btn.manual:hover{border-color:var(--amber);color:var(--amber)}
main{padding:20px;max-width:1180px;margin:0 auto}
h2{margin:4px 0 14px;font-size:20px;font-family:var(--serif);font-weight:600;letter-spacing:.3px}
h3{margin:0 0 12px;font-size:15px;font-family:var(--serif);font-weight:600}
.trend-area{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 3px rgba(80,60,30,.06)}
.trend-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.trend-head h2{margin:0}
.trend-win{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trend-summary{margin:14px 0}
.metric-cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.trend-summary .metric-cards{margin:0}
.trend-summary .trend-card{position:relative;padding:15px 17px;overflow:hidden}
.trend-summary .trend-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.trend-summary .trend-card.pos::before{background:var(--green)}
.trend-summary .trend-card.neg::before{background:var(--red)}
.trend-summary .trend-card.neutral::before{background:var(--muted)}
.trend-summary .change-label{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;letter-spacing:.3px}
.trend-summary .change-label span:last-child{font-size:10px;letter-spacing:.5px;text-transform:uppercase}
.trend-summary .change-value{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.2;margin-top:5px}
.trend-summary .change-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:12px}
.trend-summary .change-meta b{font-weight:600}
.profit-summary{margin:0 0 12px}
.profit-summary .cards{grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:0}
.profit-summary .card{padding:11px 12px}
.profit-card .label{display:flex;align-items:center;gap:7px}
.profit-swatch{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.profit-analysis-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.profit-analysis-head .chart-title{margin:0}
.profit-line-key{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.profit-line-key i{width:16px;height:3px;background:var(--text);border-radius:2px;display:inline-block}
.profit-summary .profit-value{font-family:var(--serif);font-size:21px;font-weight:600;margin-top:4px}
.chart-block{margin-top:16px;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.chart-title{font-size:14px;color:var(--text);font-weight:600;font-family:var(--serif);margin-bottom:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend label.grp-lbl{cursor:pointer;user-select:none;opacity:1;transition:.15s}
.legend label.grp-lbl:has(:not(:checked)){opacity:.45}
.legend .lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .lg i.ln{width:14px;height:3px;border-radius:2px}
.svg-wrap{width:100%}
.chart-svg{width:100%;height:190px;display:block}
.xaxis{display:flex;justify-content:space-between;margin-top:6px;padding:0 4px}
.xaxis span{font-size:10px;color:var(--muted)}
svg .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
svg .zero-line{stroke:#6f675a;stroke-width:1.5;stroke-opacity:.9}
.hover-col{cursor:crosshair}
.chart-tip{position:absolute;min-width:140px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 20px rgba(51,40,20,.18);pointer-events:none;z-index:5}
.chart-tip .tip-title{font-family:var(--serif);font-weight:700;margin-bottom:6px;font-size:13px}
.chart-tip .tip-row{display:flex;justify-content:space-between;gap:16px;padding:2px 0}
.chart-tip .tip-row span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chart-tip .tip-row i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chart-tip .tip-net{border-top:1px solid var(--line);margin-top:4px;padding-top:5px}
.chart-tip .tip-net span{color:var(--text);font-weight:600}
.chart-tip .tip-change{display:block;margin-top:1px;color:var(--muted);font-size:10px;font-weight:500}
.month-tabs{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;overflow-x:auto;margin-bottom:0;scrollbar-width:thin}
.month-tab{background:var(--panel2);border:1px solid var(--line);border-bottom:none;
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:8px 15px;color:var(--muted);border-radius:10px 10px 0 0;font-family:var(--serif);flex:0 0 auto;cursor:pointer}
.month-tab.active{color:var(--text);background:var(--panel);font-weight:600}
.month-tab .lbl{padding-right:14px}
.month-tab .close{position:absolute;right:8px;top:8px;color:var(--muted);font-size:12px}
.month-tab .close:hover{color:var(--red)}
.add-tab{background:transparent;border:1px dashed var(--line);color:var(--muted);flex:0 0 auto}
.month-panel{background:var(--panel);border:1px solid var(--line);border-radius:0 14px 14px 14px;padding:20px 22px;min-height:200px;box-shadow:0 1px 3px rgba(80,60,30,.06)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:14px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:.18s;container-type:inline-size}
.card:hover{box-shadow:0 2px 8px rgba(80,60,30,.08)}
.card .label{color:var(--muted);font-size:12px;letter-spacing:.3px}
.card .value{font-size:24px;font-weight:600;margin-top:6px;font-family:var(--serif)}
.amount{font-variant-numeric:tabular-nums;white-space:nowrap}
.amount-compact{display:none}
.balance .amount-full,.flow .amount-full{display:none}
.balance .amount-compact,.flow .amount-compact{display:inline}
@container (max-width:235px){.amount-full{display:none}.amount-compact{display:inline}}
.table-wrap{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px}
table{width:100%;min-width:920px;border-collapse:collapse;margin:0;background:transparent}
.balance{table-layout:fixed;min-width:1000px}
.balance :is(th,td):nth-child(1){width:14%}
.balance :is(th,td):nth-child(2){width:9%}
.balance :is(th,td):nth-child(3){width:11%}
.balance :is(th,td):nth-child(4){width:8%}
.balance :is(th,td):nth-child(5){width:14%}
.balance :is(th,td):nth-child(6){width:15%}
.balance :is(th,td):nth-child(7){width:7%}
.balance :is(th,td):nth-child(8){width:13%}
.balance :is(th,td):nth-child(9){width:9%}
.balance tbody tr:not(.group-head) td:first-child{overflow:hidden;text-overflow:ellipsis}
.balance.editing{min-width:1080px}
.balance.editing :is(th,td):nth-child(8){width:14%;min-width:10ch}
.balance.editing :is(th,td):nth-child(9){width:104px;min-width:104px}
.balance.editing .ops{flex-wrap:nowrap;white-space:nowrap;min-width:0;gap:3px}
.icon-btn{width:28px;height:28px;padding:0;display:inline-grid;place-items:center;line-height:1;font-size:15px}
#assetDialog :is(input,select):disabled{background:#e9e2d3;color:var(--muted);border-style:dashed;opacity:1;cursor:not-allowed}
#assetDialog .fld:has(:disabled)::after{content:"只读";display:inline-block;margin-left:6px;color:var(--muted);font-size:10px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums lining-nums}
th:first-child,td:first-child{text-align:left}
thead th{background:transparent;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase;border-bottom:1.5px solid var(--text)}
.balance :is(th,td):nth-child(2),.balance :is(th,td):nth-child(3){text-align:center}
.balance :is(th,td):nth-child(n+4):nth-child(-n+8),.balance :is(th,td):nth-child(9){text-align:right}
.flow :is(th,td):nth-child(1),.flow :is(th,td):nth-child(2),.flow :is(th,td):nth-child(3),.flow :is(th,td):nth-child(4),.flow :is(th,td):nth-child(6){text-align:left}
.flow :is(th,td):nth-child(5),.flow :is(th,td):nth-child(7){text-align:right}
.balance:not(.editing) :is(th,td):nth-child(9),.flow:not(.editing) :is(th,td):nth-child(7){display:none}
.balance-mobile{display:none}
.balance-mobile .mobile-group{margin:10px 0 4px;font-family:var(--serif);font-weight:700}
.balance-mobile .mobile-asset{border:1px solid var(--line);border-radius:8px;padding:10px;margin:7px 0;background:var(--panel)}
.balance-mobile .mobile-title{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.balance-mobile .mobile-meta,.balance-mobile .mobile-values{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-size:12px;color:var(--muted)}
.balance-mobile .mobile-values{color:var(--text);font-size:13px}
.balance-mobile .mobile-ops{display:none;justify-content:flex-end;gap:5px;margin-top:8px}
.balance-mobile.editing .mobile-ops{display:flex}
.flow-route-mobile{display:none}
.trend-table-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px}
.trend-table{min-width:max-content;margin:0}
.trend-table th,.trend-table td{min-width:104px;padding:10px 9px;text-align:right;vertical-align:middle}
.trend-table th:first-child,.trend-table td:first-child{position:sticky;left:0;z-index:1;min-width:78px;text-align:left;background:var(--panel)}
.trend-table thead th{position:sticky;top:0;z-index:2;background:var(--panel2)}
.trend-table thead th:first-child{z-index:3}
.trend-table .group-head{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px}
.trend-table .group-head i{width:9px;height:9px;flex:0 0 auto;border-radius:2px}
.trend-table .change-cell{font-weight:600}
.trend-table .change-cell.zero{color:var(--muted);font-weight:400}
.trend-table .trend-opening-row td{background:rgba(224,215,196,.32);border-bottom:1.5px solid var(--line)}
.trend-table .trend-opening-row td:first-child{background:var(--panel)}
.trend-table .trend-total-row td{background:var(--panel2);border-top:1.5px solid var(--text);border-bottom:none}
.trend-table .trend-total-row td:first-child{background:var(--panel2)}
.trend-total{display:flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1.2}
.trend-total small{font-size:10px;color:var(--muted);font-weight:400}
.subtotal .subtotal-label{text-align:left}
.subtotal .subtotal-amount,.subtotal .subtotal-pct{text-align:right}
.money{display:inline-flex;align-items:baseline;justify-content:flex-end;gap:5px;min-width:12ch}
.currency-code{color:var(--muted);font-size:10px;font-family:-apple-system,"Segoe UI",sans-serif;letter-spacing:.4px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)}
.pnl-zero{color:var(--muted)}
.flow-in{color:var(--green);font-weight:600}.flow-out{color:var(--red);font-weight:600}
.empty{color:var(--muted);padding:24px;text-align:center}
.hint{color:var(--muted);font-size:12px;margin:8px 0}
.statusbar{display:flex;justify-content:space-between;padding:8px 16px;color:var(--muted);
  font-size:12px;border-top:1px solid var(--line);background:var(--panel)}
.modal{position:fixed;inset:0;background:rgba(51,48,42,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:10}
.modal[hidden]{display:none}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;width:420px;max-width:92vw;box-shadow:0 8px 40px rgba(51,40,20,.2)}
#flowDialog .modal-box{width:560px}
.fld{display:block;margin:14px 0}
.fld[hidden]{display:none}
.fld input{width:100%;margin-top:6px}
.grid2>.fld{min-width:0}
#flowDialog .grid2 select,#flowDialog .grid2 input{width:100%}
#fd-from-wrap,#fd-to-wrap{display:block;min-width:0;margin-top:6px}
#fd-from-wrap select,#fd-to-wrap select,#fd-from-wrap input,#fd-to-wrap input{width:100%;max-width:100%}
.mut{color:var(--muted);font-size:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld.inline{display:flex;align-items:center;gap:8px}
.fld.inline[hidden]{display:none}
.fld.inline input{width:auto;margin:0}
.tbl-head{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.tbl-head h3{margin:0}
button.mini{padding:4px 10px;font-size:12px}
.ops{display:flex;gap:4px;justify-content:flex-end}
table.balance td.ops{white-space:nowrap}
tbody tr:hover{background:rgba(224,215,196,.35)}
tr.group-head td{background:var(--panel2);font-weight:700;color:var(--text);font-family:var(--serif);
  border-top:1.5px solid var(--text);letter-spacing:.5px}
tr.subtotal td{background:rgba(184,146,63,.1);font-weight:600;color:var(--text)}
tr.nettotal td{background:var(--panel2);font-weight:700;font-size:15px}
.badge{display:inline-block;font-size:11px;border-radius:10px;padding:0 5px;margin-left:4px}
.badge.ok{color:var(--green);border:1px solid var(--green)}
.badge.warn{color:var(--amber);border:1px solid var(--amber)}
.badge.opened{color:var(--accent);border:1px solid var(--accent)}
.badge.manual{color:var(--amber);border:1px solid var(--amber);font-style:normal}
.badge.manual-ok{color:var(--amber);border:1px solid var(--amber);font-style:normal}
.badge.closed{color:var(--muted);border:1px solid var(--muted)}
.badge.short{color:var(--red);border:1px solid var(--red)}
.fxbar{margin:14px 0;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fxbar label.fx{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.fxbar input{padding:4px 8px}
.newinv-box{border:1px dashed var(--line);border-radius:8px;padding:12px;margin:8px 0;background:var(--panel2)}
.cashflow{margin:12px 0}
.cf-main{display:flex;align-items:stretch;gap:12px;flex-wrap:wrap}
.cf-item{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:14px;display:flex;flex-direction:column;gap:4px;container-type:inline-size}
.cf-item.in{border-left:3px solid var(--green)}
.cf-item.out{border-left:3px solid var(--red)}
.cf-item.net{border-left:3px solid var(--accent)}
.cf-lbl{color:var(--muted);font-size:12px}
.cf-val{font-size:22px;font-weight:600}
.cf-item.in .cf-val{color:var(--green)} .cf-item.out .cf-val{color:var(--red)}
.cf-sub{font-size:12px;margin-top:4px}
.cf-sub.mut{color:var(--muted)}
.cf-arrow{display:flex;align-items:center;color:var(--muted);font-size:20px}
.banner{border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.6}
.banner.info{background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.banner.ok{background:rgba(34,197,94,.08);border:1px solid var(--green);color:var(--text)}
.banner.warn{background:rgba(245,158,11,.08);border:1px solid var(--amber);color:var(--text)}
.banner ul{margin:8px 0 0;padding-left:20px}
.banner li{margin:2px 0}
.reconcile-status{margin-bottom:14px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:13px}
.reconcile-status summary{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;list-style:none;color:var(--muted)}
.reconcile-status summary::-webkit-details-marker{display:none}
.reconcile-status summary:hover{color:var(--text)}
.reconcile-status[open] summary{border-bottom:1px solid var(--line)}
.reconcile-status .status-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.reconcile-status .status-label{font-weight:600;color:var(--text)}
.reconcile-status .status-detail{margin-left:auto;font-size:12px}
.reconcile-status .status-content{padding:10px 12px;line-height:1.65}
.reconcile-status.ok .status-dot{background:var(--green)}
.reconcile-status.warn .status-dot{background:var(--amber)}
.reconcile-status.danger .status-dot{background:var(--red)}
.sync-changes{margin:8px 0 0;padding-left:19px;font-size:12px;line-height:1.55}
.sync-changes li{margin:2px 0}
.sync-change-details{margin:3px 0 6px;padding-left:18px;color:var(--ink)}
.sync-change-details li{margin:1px 0}
.sync-row{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* 窄屏保留报表密度：摘要双列，明细表横向滚动，录入弹窗改为底部全宽。 */
@media (max-width:720px){
  body{font-size:13px}
  .topbar{padding:12px 14px;gap:12px;align-items:flex-start}
  .brand{font-size:17px}
  .ledger-ctrl{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .ledger-ctrl:has(.guide[open]){justify-content:initial}
  .ledger-ctrl>button,.guide summary{width:100%;min-width:0;justify-content:center;padding:8px 7px}
  .guide{min-width:0}
  .guide[open]{grid-column:1/-1;align-items:stretch}
  .guide[open] summary{align-self:stretch}
  .guide-content{width:100%;margin:0;padding:14px;max-height:70vh;overflow:auto}
  main{padding:12px;max-width:none}
  .trend-area,.month-panel{padding:14px;border-radius:10px}
  .trend-head{align-items:flex-start}
  .trend-win{width:100%}
  .trend-win select{flex:1;min-width:0}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .metric-cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .trend-summary .trend-card,.card{padding:12px}
  .trend-summary .change-value,.card .value{font-size:21px}
  .trend-summary .change-label span:last-child{display:none}
  .chart-block{padding:13px 12px;margin-top:12px}
  .chart-svg{height:170px}
  .legend{gap:8px 12px}
  .month-tabs{margin-left:-12px;margin-right:-12px;padding:0 12px}
  .month-tab{padding:8px 12px}
  .tbl-head{gap:8px;align-items:flex-start;flex-wrap:wrap}
  .tbl-head>div{display:flex;gap:6px;flex-wrap:wrap}
  .table-wrap{margin-left:-2px;margin-right:-2px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .balance{min-width:770px}
  .balance.editing{min-width:860px}
  .flow{min-width:620px;table-layout:fixed}
  .balance :is(th,td):nth-child(3),.flow :is(th,td):nth-child(6){display:none}
  .balance :is(th,td):nth-child(1){width:16%}
  .balance :is(th,td):nth-child(2){width:9%}
  .balance :is(th,td):nth-child(4){width:9%}
  .balance :is(th,td):nth-child(5){width:15%}
  .balance :is(th,td):nth-child(6){width:17%}
  .balance :is(th,td):nth-child(7){width:7%}
  .balance :is(th,td):nth-child(8){width:14%}
  .balance :is(th,td):nth-child(9){width:13%}
  .flow :is(th,td):nth-child(1){width:12%}
  .flow :is(th,td):nth-child(2){width:12%}
  .flow :is(th,td):nth-child(3),.flow :is(th,td):nth-child(4){width:22%}
  .flow :is(th,td):nth-child(5){width:17%}
  .trend-table th,.trend-table td{min-width:88px;padding:8px 7px}
  th,td{padding:8px 9px}
  .fxbar{gap:8px;padding:10px}
  .fxbar>span{width:100%}
  .cashflow{margin:10px 0}
  .cf-main{gap:8px}
  .cf-arrow{display:none}
  .cf-item{min-width:calc(50% - 4px);padding:11px}
  .cf-val{font-size:19px}
  .statusbar{padding:8px 12px;gap:4px;align-items:flex-start;flex-wrap:wrap}
  .modal{padding:10px;align-items:flex-end}
  .modal-box,#flowDialog .modal-box{width:100%;max-width:none;max-height:calc(100dvh - 20px);overflow:auto;padding:18px;border-radius:12px}
  .grid2{grid-template-columns:1fr;gap:0}
  .modal-actions{position:sticky;bottom:-18px;padding:12px 0 0;margin-top:14px;background:var(--panel)}
}
@media (max-width:560px){
  .metric-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .table-wrap{margin-left:-4px;margin-right:-4px}
  .balance-table-wrap{display:none}
  .balance-mobile{display:block}
  .flow{min-width:430px;font-size:11px}
  .balance :is(th,td):nth-child(2),.flow :is(th,td):nth-child(4){display:none}
  .balance :is(th,td):nth-child(1){width:19%}
  .balance :is(th,td):nth-child(4){width:10%}
  .balance :is(th,td):nth-child(5){width:15%}
  .balance :is(th,td):nth-child(6){width:18%}
  .balance :is(th,td):nth-child(7){width:7%}
  .balance :is(th,td):nth-child(8){width:17%}
  .balance :is(th,td):nth-child(9){width:14%}
  .flow :is(th,td):nth-child(1){width:15%}
  .flow :is(th,td):nth-child(2){width:15%}
  .flow :is(th,td):nth-child(3){width:30%;white-space:normal}
  .flow :is(th,td):nth-child(5){width:21%}
  .flow :is(th,td):nth-child(7){width:19%}
  .balance .money,.flow .money{min-width:0;gap:3px}
  .flow th:nth-child(3){font-size:0}
  .flow th:nth-child(3)::after{content:"资金方向";font-size:11px}
  .flow-route-mobile{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10px;margin-top:2px}
  .trend-table th,.trend-table td{min-width:76px;padding:7px 6px;font-size:11px}
  .trend-table th:first-child,.trend-table td:first-child{min-width:62px}
  .trend-table .group-head{white-space:normal;line-height:1.2}
}
@media (max-width:380px){
  .ledger-ctrl>button,.guide summary{font-size:13px}
  .trend-summary .cards,.cards{gap:7px}
  .trend-summary .trend-card,.card{padding:10px}
  .trend-summary .change-value,.card .value{font-size:19px}
  .card .label,.trend-summary .change-label{font-size:11px}
  .cf-item{min-width:100%}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="brand-icon" src="./wealth_tracker.svg" alt="" /><div class="brand-copy"><span class="brand-kicker">WEALTH TRACKER</span><span id="brandName">资产价值追踪</span></div></div>
  <div class="ledger-ctrl">
    <button id="btnLedgerManager">账本管理</button>
    <button id="btnBackup" title="下载当前账本的 JSON 备份">备份</button>
    <button id="btnInstallApp" hidden title="将 Wealth Tracker 添加到设备桌面">添加到桌面</button>
    <details id="guide" class="guide">
    <summary>使用说明</summary>
    <div class="guide-content" id="guideContent"><p class="mut">正在加载 README…</p></div>
    </details>
  </div>
</header>

<main>
  <section class="trend-area">
    <div class="trend-head">
      <h2>整体趋势</h2>
      <div class="trend-win">
        <select id="trendWindow">
          <option value="12">最近12个月</option>
          <option value="ytd">年初至今</option>
          <option value="all" selected>全部</option>
          <option value="custom">自定义…</option>
        </select>
        <button class="mini" id="trendRefresh" type="button" title="重新计算并绘制趋势图">刷新趋势</button>
        <span id="trendCustom" hidden>
          <input type="month" id="trendFrom" /> ~ <input type="month" id="trendTo" />
          <button class="mini" id="trendApply">应用</button>
        </span>
      </div>
    </div>
    <div id="trendSummary" class="trend-summary"></div>
    <div id="trendCharts"></div>
  </section>

  <nav class="month-tabs" id="monthTabs"></nav>
  <section id="monthPanel" class="month-panel"></section>
</main>

<footer class="statusbar">
  <span id="status">就绪</span>
  <span id="storageInfo"></span>
</footer>

<!-- 新建账本对话框 -->
<div id="ledgerManagerDialog" class="modal" hidden>
  <div class="modal-box">
    <h3>账本管理</h3>
    <div id="ledgerManagerCurrent" class="manager-current"></div>
    <div class="manager-actions">
      <button id="btnManagerCreate" class="primary">＋ 新建</button>
      <button id="btnManagerOpen">打开 JSON</button>
      <button id="btnManagerRename">重命名</button>
      <button id="btnManagerPassword">设置密码</button>
    </div>
    <div class="manager-section">
      <div class="mut">已知账本</div>
      <div id="ledgerManagerList" class="manager-list"></div>
    </div>
    <div class="modal-actions"><button id="btnManagerDone">完成</button></div>
  </div>
</div>

<div id="createDialog" class="modal" hidden>
  <div class="modal-box">
    <h3>新建账本</h3>
    <label class="fld">账本名称 <span class="mut">(用作文件名与网页标题)</span>
      <input id="newName" type="text" placeholder="例如：我家账本" />
    </label>
    <div class="grid2">
      <label class="fld">密码 <span class="mut">(可留空)</span><input id="newPassword" type="password" autocomplete="new-password" /></label>
      <label class="fld">确认密码 <input id="newPasswordConfirm" type="password" autocomplete="new-password" /></label>
    </div>
    <div class="fld">
      <div class="mut">点「创建」后选择本地目录，网页会在其中新建 JSON 文件；之后所有修改会自动写回该文件。</div>
      <div id="fsUnsupported" class="banner warn" hidden style="margin-top:10px">
        当前浏览器不支持本地目录写回。仍可导入 JSON 并在编辑后下载更新版；如需自动保存回原文件，请使用 Chrome 或 Edge 访问 HTTPS 网页。
      </div>
    </div>
    <div class="modal-actions">
      <button id="btnCreateCancel">取消</button>
      <button id="btnCreateOk" class="primary">创建并选择本地目录…</button>
    </div>
  </div>
</div>

<input id="fallbackJsonInput" type="file" accept="application/json,.json" hidden />

<!-- 资产录入/编辑对话框 -->
<div id="assetDialog" class="modal" hidden>
  <div class="modal-box">
    <h3 id="assetDlgTitle">添加资产</h3>
    <label class="fld">资产大类
      <select id="adCls">
        <option value="stock">股票</option>
        <option value="fund">基金</option>
        <option value="cash">现金</option>
        <option value="liability">负债</option>
        <option value="fixed">固定资产</option>
      </select>
    </label>
    <div class="grid2">
      <label class="fld">分组 <input id="adGroup" list="assetGroupList" placeholder="如 A股/美股/存款" /></label>
      <label class="fld">项目 <input id="adName" placeholder="如 贵州茅台" /></label>
    </div>
    <div class="grid2">
      <label class="fld" id="f-account">账户 <input id="adAccount" list="assetAccountList" placeholder="如 招商证券" /></label>
      <label class="fld">货币
        <select id="adCurrency">
          <option value="CNY">人民币 CNY</option>
          <option value="USD">美元 USD</option>
          <option value="HKD">港币 HKD</option>
        </select>
      </label>
    </div>
    <div class="grid2">
      <label class="fld" id="f-qty">数量 <input id="adQty" type="number" step="any" /></label>
      <label class="fld" id="f-price">价格(原币) <input id="adPrice" type="number" step="any" /></label>
    </div>
    <label class="fld" id="f-value"><span>金额(原币)</span> <input id="adValue" type="number" step="any" /></label>
    <label class="fld inline" id="f-auto"><input id="adAuto" type="checkbox" /> 自动更新价格（月末收盘价）</label>
    <div class="grid2">
      <label class="fld" id="f-market">市场
        <select id="adMarket">
          <option value="cn">中国 A股（沪/深）</option>
          <option value="us">美股</option>
          <option value="hk">港股</option>
        </select>
      </label>
      <label class="fld" id="f-symbol">股票代码 <input id="adSymbol" placeholder="如 aapl / 600519" /></label>
    </div>
    <div class="modal-actions">
      <button id="btnAssetCancel">取消</button>
      <button id="btnAssetOk" class="primary">确定</button>
    </div>
  </div>
</div>

<datalist id="assetGroupList"></datalist>
<datalist id="assetAccountList"></datalist>

<!-- 密码输入对话框：始终使用 password 类型，避免浏览器明文 prompt -->
<div id="passwordDialog" class="modal" hidden>
  <div class="modal-box">
    <h3 id="passwordDlgTitle">账本密码</h3>
    <p id="passwordDlgHint" class="mut"></p>
    <label class="fld" id="passwordCurrentWrap" hidden>当前密码 <input id="passwordCurrent" type="password" autocomplete="current-password" /></label>
    <label class="fld" id="passwordNewWrap">密码 <input id="passwordNew" type="password" autocomplete="new-password" /></label>
    <label class="fld" id="passwordConfirmWrap" hidden>确认密码 <input id="passwordConfirm" type="password" autocomplete="new-password" /></label>
    <div class="modal-actions">
      <button id="btnPasswordCancel">取消</button>
      <button id="btnPasswordOk" class="primary">确定</button>
    </div>
  </div>
</div>

<div id="installGuideDialog" class="modal" hidden>
  <div class="modal-box">
    <h3>添加到桌面</h3>
    <div id="installGuideContent" class="mut"></div>
    <div class="modal-actions"><button id="btnInstallGuideDone" class="primary">知道了</button></div>
  </div>
</div>

<!-- 流水录入/编辑对话框 -->
<div id="flowDialog" class="modal" hidden>
  <div class="modal-box">
    <h3 id="flowDlgTitle">添加流水</h3>
    <div class="grid2">
      <label class="fld">类型
        <select id="fdKind">
          <option value="income">收入</option>
          <option value="dividend">资产收益</option>
          <option value="expense">支出</option>
          <option value="transfer">转账</option>
          <option value="buy">买入</option>
          <option value="sell">卖出</option>
          <option value="repay">还款</option>
        </select>
      </label>
      <label class="fld">日期 <input id="fdDate" type="date" /></label>
    </div>
    <div class="grid2">
      <label class="fld"><span id="fdFromLabel">流出方</span> <span id="fd-from-wrap"></span></label>
      <label class="fld"><span id="fdToLabel">流入方</span> <span id="fd-to-wrap"></span></label>
    </div>
    <label class="fld inline" id="fd-liquidate" hidden><input id="fdLiquidate" type="checkbox" /> <span id="fdLiqLabel">清仓（全部卖出当前持仓）</span></label>
    <label class="fld" id="fd-amount"><span id="fdAmountLabel">金额</span> <input id="fdAmount" type="text" inputmode="decimal" placeholder="支持 1000+200*3" /></label>
    <div class="grid2" id="fd-qp">
      <label class="fld">数量 <span class="mut">(负数表示做空/回补)</span><input id="fdQty" type="number" step="any" /></label>
      <label class="fld">价格 <input id="fdPrice" type="number" step="any" /></label>
    </div>
    <label class="fld" id="fd-fx" hidden><span id="fdFxLabel">换汇汇率</span><input id="fdFxRate" type="number" step="any" /></label>
    <div id="fd-newinv" class="newinv-box">
      <div class="mut" style="margin-bottom:8px">新建资产（将写入资产负债表）</div>
      <label class="fld">资产类型
        <select id="niCls">
          <option value="stock">股票</option>
          <option value="fund">基金</option>
          <option value="cash">现金</option>
          <option value="fixed">固定资产</option>
        </select>
      </label>
      <div class="grid2">
        <label class="fld">分组 <input id="niGroup" list="assetGroupList" placeholder="如 A股/美股/房产" /></label>
        <label class="fld">项目 <input id="niName" placeholder="如 苹果" /></label>
      </div>
      <div class="grid2">
        <label class="fld">账户 <input id="niAccount" list="assetAccountList" placeholder="如 富途" /></label>
        <label class="fld">货币
          <select id="niCurrency">
            <option value="CNY">人民币 CNY</option>
            <option value="USD">美元 USD</option>
            <option value="HKD">港币 HKD</option>

      <div id="ni-stock-only">
        <label class="fld inline"><input id="niAuto" type="checkbox" /> 自动更新价格</label>
        <div class="grid2" id="ni-auto-fields">
          <label class="fld">市场
            <select id="niMarket"><option value="cn">中国A股</option><option value="us">美股</option><option value="hk">港股</option></select>
          </label>
          <label class="fld">股票代码 <input id="niSymbol" placeholder="如 aapl / 600519" /></label>

    <label class="fld" id="fd-subcat">分类 <input id="fdSubcat" placeholder="如 工资/奖金/旅行/交通" list="subcatList" /></label>
    <datalist id="subcatList"></datalist>
    <label class="fld">备注 <input id="fdNote" placeholder="可空" /></label>
    <div class="modal-actions">
      <button id="btnFlowCancel">取消</button>
      <button id="btnFlowOk" class="primary">确定</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =========================================================
   Wealth Tracker —— 单 JSON、本地优先的资产价值追踪工具
   -----------------------------------------------------------------
   一个账本 = 一个 JSON 文件。每月保存期末资产、流水、汇率、期初快照、
   同步版本与变更日志；流水通过稳定资产 ID 关联账户和持仓。
   Chrome/Edge 可通过 File System Access API 自动写回原文件；其他浏览器
   在内存中编辑后下载备份。localStorage 只记住最近账本名称，不保存账本数据。
   ========================================================= */

const APP_NAME = "WEALTH TRACKER";
// 资产大类定义: 决定录入时填哪些字段
const ASSET_CLASSES = {
  stock:     { name:"股票",     hasQty:true,  hasAccount:true,  hasAuto:true,  sign:1  },
  fund:      { name:"基金",     hasQty:false, hasAccount:true,  hasAuto:false, sign:1  },
  cash:      { name:"现金",     hasQty:false, hasAccount:true,  hasAuto:false, sign:1  },
  liability: { name:"负债",     hasQty:false, hasAccount:true,  hasAuto:false, sign:-1 },
  fixed:     { name:"固定资产", hasQty:false, hasAccount:false, hasAuto:false, sign:1  },
};
// 流水类型定义: from/to 指定各端是"哪类资产"还是自由文本
// side 值: 'cash'|'holding'(股票+基金+固定资产)|'asset'(全部非负债资产)|'liability'|'free'
const FLOW_TYPES = {
  income:   { name:"收入", from:"free",      to:"asset",     needQtyPrice:false, subcat:true, newAsset:true, toLabel:"流入资产" },
  // 保持 dividend 作为 JSON 内部标识，避免已保存账本失去兼容性。
  dividend: { name:"资产收益", from:"asset",   to:"cash",     needQtyPrice:false, newHolding:false, assetIncome:true, fromLabel:"收益来源（已有资产）", toLabel:"到账账户" },
  expense:  { name:"支出", from:"cash",      to:"free",      needQtyPrice:false, subcat:true  },
  transfer: { name:"转账", from:"cash",      to:"cash",      needQtyPrice:false },
  buy:      { name:"买入", from:"cash",      to:"holding",   needQtyPrice:true, newHolding:true  },
  sell:     { name:"卖出", from:"holding",   to:"cash",      needQtyPrice:true, newHolding:true  },
  repay:    { name:"还款", from:"cash",      to:"liability", needQtyPrice:false },
};
const HAS_FS = ("showOpenFilePicker" in window && "showDirectoryPicker" in window);
const IDB_DB = "familyLedgerDB", IDB_STORE = "handles";

// ---------- 运行时状态 ----------
let ledger = null;          // 当前账本对象
let fileHandle = null;      // 绑定的本地文件句柄(必需)
let directoryHandle = null; // 创建账本时选择的目录句柄（用于显示与恢复）
let demoMode = false;       // 网页首次体验的示例账本：仅内存展示，需主动下载副本
let activeMonth = null;     // 当前选中的月份 tab
let balanceEditMode = false;// 资产表编辑状态跨重新渲染保留，切换月份时重置
let flowEditMode = false;   // 流水表编辑状态跨重新渲染保留，切换月份时重置
let encryptionKey = null;   // 仅保留在当前浏览器内存中的 AES 密钥
let encryptionMeta = null;
// 已知账本注册表: name -> fileHandle。会话内内存 + IndexedDB 持久化(句柄可跨刷新恢复)
const registry = {};

// ---------- IndexedDB: 持久化文件句柄 ----------
function idbOpen(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(IDB_DB,1);
    req.onupgradeneeded=()=>req.result.createObjectStore(IDB_STORE);
    req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);
  });
}
async function idbSet(key,val){ const db=await idbOpen(); return new Promise((res,rej)=>{
  const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).put(val,key);
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbGetAll(){ const db=await idbOpen(); return new Promise((res,rej)=>{
  const tx=db.transaction(IDB_STORE,"readonly"); const st=tx.objectStore(IDB_STORE);
  const keys=st.getAllKeys(), vals=st.getAll(); const out={};
  tx.oncomplete=()=>{ keys.result.forEach((k,i)=>out[k]=vals.result[i]); res(out); }; tx.onerror=()=>rej(tx.error); }); }
async function idbDel(key){ const db=await idbOpen(); return new Promise((res,rej)=>{
  const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).delete(key);
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }

function uid(p){ return (p||"id")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function escapeHTML(value){
  return String(value??"").replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[ch]));
}
function escapeAttr(value){ return escapeHTML(value); }
function renderReadmeInline(value){
  let safe=escapeHTML(value);
  safe=safe.replace(/`([^`]+)`/g,"<code>$1</code>");
  safe=safe.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  return safe.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(_,label,url)=>{
    const href=/^(https?:\/\/|\.\/|\/)/.test(url)?url:"#";
    const external=/^https?:\/\//.test(href);
    return `<a href="${escapeAttr(href)}"${external?' target="_blank" rel="noopener"':""}>${label}</a>`;
  });
}
function renderReadmeMarkdown(markdown){
  const out=[]; let list="", paragraph=[]; let inCode=false, code=[];
  const closeList=()=>{ if(list){ out.push(`</${list}>`); list=""; } };
  const flushParagraph=()=>{ if(paragraph.length){ out.push(`<p>${renderReadmeInline(paragraph.join(" "))}</p>`); paragraph=[]; } };
  const closeText=()=>{ flushParagraph(); closeList(); };
  for(const rawLine of String(markdown||"").replace(/\r/g,"").split("\n")){
    if(rawLine.trim().startsWith("```")){
      if(inCode) out.push(`<pre><code>${escapeHTML(code.join("\n"))}</code></pre>`);
      else closeText();
      inCode=!inCode; code=[]; continue;
    }
    if(inCode){ code.push(rawLine); continue; }
    const heading=rawLine.match(/^(#{1,3})\s+(.+)$/);
    const ordered=rawLine.match(/^\d+\.\s+(.+)$/);
    const unordered=rawLine.match(/^[-*]\s+(.+)$/);
    if(heading){ closeText(); out.push(`<h3>${renderReadmeInline(heading[2])}</h3>`); }
    else if(ordered||unordered){
      flushParagraph(); const type=ordered?"ol":"ul";
      if(list&&list!==type) closeList();
      if(!list){ list=type; out.push(`<${type}>`); }
      out.push(`<li>${renderReadmeInline((ordered||unordered)[1])}</li>`);
    }else if(!rawLine.trim()) closeText();
    else { closeList(); paragraph.push(rawLine.trim()); }
  }
  if(inCode) out.push(`<pre><code>${escapeHTML(code.join("\n"))}</code></pre>`);
  else closeText();
  return out.join("\n");
}

function textValue(value,max=160){ return String(value??"").replace(/[\u0000-\u001f\u007f]/g," ").trim().slice(0,max); }
function assertLedgerShape(data){
  if(!data||typeof data!=="object"||Array.isArray(data)||!data.months||typeof data.months!=="object"||Array.isArray(data.months)) throw new Error("不是有效的资产追踪 JSON");
  for(const [key,month] of Object.entries(data.months)){
    if(!/^\d{4}-\d{2}$/.test(key)||!month||typeof month!=="object"||Array.isArray(month)) throw new Error(`月份 ${key||"(空)"} 格式无效`);
    if(month.balance!=null&&!Array.isArray(month.balance)) throw new Error(`${key} 的资产列表格式无效`);
    if(month.flows!=null&&!Array.isArray(month.flows)) throw new Error(`${key} 的流水列表格式无效`);
  }
}
function migrateLedger(data){
  assertLedgerShape(data);
  data.name=textValue(data.name||"未命名资产追踪",80);
  Object.entries(data.months).forEach(([key,month])=>{
    month.balance=Array.isArray(month.balance)?month.balance:[];
    month.flows=Array.isArray(month.flows)?month.flows:[];
    month.fxRates=month.fxRates&&typeof month.fxRates==="object"?month.fxRates:{CNY:1};
    if(month.fxRates.CNY==null) month.fxRates.CNY=1;
    Object.entries(month.fxRates).forEach(([currency,rate])=>{
      if(currency.startsWith("_")) return;
      if(!Number.isFinite(Number(rate))||Number(rate)<=0) throw new Error(`${key} 的 ${textValue(currency,12)} 汇率无效`);
      month.fxRates[currency]=Number(rate);
    });
    const ids=new Set();
    month.balance.forEach(row=>{
      if(!row||typeof row!=="object") throw new Error("资产条目格式无效");
      if(!ASSET_CLASSES[row.cls]) throw new Error(`未知资产类型：${textValue(row.cls,30)}`);
      row.id=textValue(row.id,100);
      if(!row.id) row.id=uid("a");
      if(ids.has(row.id)) throw new Error(`${key} 存在重复资产 ID：${row.id}`);
      ids.add(row.id);
      ["name","group","account","currency","market","symbol"].forEach(key=>{ if(row[key]!=null) row[key]=textValue(row[key]); });
      ["qty","price","value","costBasisCNY"].forEach(field=>{
        if(row[field]==null) return;
        if(!Number.isFinite(Number(row[field]))) throw new Error(`${key} 的资产「${row.name||row.id}」存在无效${field}`);
        row[field]=Number(row[field]);
      });
      if(row.costBasisCNY==null && row.cls!=="cash" && row.cls!=="liability") {
        const rate=Number(month.fxRates[row.currency||"CNY"]||1);
        row.costBasisCNY=Math.abs((row.cls==="stock"?Number(row.qty||0)*Number(row.price||0):Number(row.value||0))*rate);
      }
    });
    const flowIds=new Set();
    month.flows.forEach(flow=>{
      if(!flow||typeof flow!=="object"||!FLOW_TYPES[flow.kind]) throw new Error("存在未知或损坏的流水类型");
      flow.id=textValue(flow.id,100);
      if(!flow.id) flow.id=uid("f");
      if(flowIds.has(flow.id)) throw new Error(`${key} 存在重复流水 ID：${flow.id}`);
      flowIds.add(flow.id);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(flow.date||"")||flow.date.slice(0,7)!==key) throw new Error(`${key} 存在日期不属于本月的流水`);
      ["from","to"].forEach(side=>{
        const idKey=`${side}AssetId`, idxKey=`${side}Idx`;
        if(flow[idKey]!=null) flow[idKey]=textValue(flow[idKey],100);
        if(!flow[idKey]&&Number.isInteger(flow[idxKey])){
          if(!month.balance[flow[idxKey]]) throw new Error(`${key} 的流水引用了不存在的资产`);
          flow[idKey]=month.balance[flow[idxKey]].id;
        }
        delete flow[idxKey];
      });
      ["fromText","toText","note","subcat","currency","toCurrency","holdingCurrency"].forEach(key=>{ if(flow[key]!=null) flow[key]=textValue(flow[key]); });
    });
    const validIds=new Set(month.balance.map(row=>row.id));
    month.flows.forEach(flow=>{
      const type=FLOW_TYPES[flow.kind];
      ["from","to"].forEach(side=>{
        if(type[side]!=="free" && (!flow[`${side}AssetId`]||!validIds.has(flow[`${side}AssetId`])))
          throw new Error(`${key} 的${type.name}流水引用了不存在的${side==="from"?"来源":"去向"}资产`);
      });
      ["amount","qty","price","toAmount","holdingAmount","fxRate","costAddedCNY","costReductionCNY","realizedPnlCNY"].forEach(field=>{
        if(flow[field]!=null&&!Number.isFinite(Number(flow[field]))) throw new Error(`${key} 存在无效流水金额`);
        if(flow[field]!=null) flow[field]=Number(flow[field]);
      });
      // 历史账本曾允许收入等流水引用非标准类别。导入时只校验 ID 存在，
      // 不追溯性改变其现金流、余额或成本口径；新流水由录入界面实施类别约束。
      if(flow.nonCashIncome!=null) flow.nonCashIncome=flow.nonCashIncome===true;
      if(flow.incomeAssetMode!=null) flow.incomeAssetMode=textValue(flow.incomeAssetMode,20);
    });
  });
  ensureMonthMetadata(data);
  return data;
}

function flowChangeSummary(flow,month,prefix){
  const type=FLOW_TYPES[flow?.kind]?.name||flow?.kind||"流水";
  const assets=new Map((month?.balance||[]).map(row=>[row.id,row.name||"未命名资产"]));
  const from=flow?.fromAssetId?assets.get(flow.fromAssetId):(flow?.fromText||"");
  const to=flow?.toAssetId?assets.get(flow.toAssetId):(flow?.toText||"");
  const route=from&&to?`${from} → ${to}`:(to?`到 ${to}`:(from?`从 ${from}`:""));
  return `${prefix}${type}流水：${fmtFull(flowAmount(flow))} ${flow?.currency||"CNY"}${route?`（${route}）`:""}`;
}
function describeMonthChanges(before,after,fallback){
  if(!before||!after) return [];
  const details=[];
  const beforeFlows=new Map((before.flows||[]).map(flow=>[flow.id,flow]));
  const afterFlows=new Map((after.flows||[]).map(flow=>[flow.id,flow]));
  const changedFlowIds=new Set();
  afterFlows.forEach((flow,id)=>{
    const old=beforeFlows.get(id);
    if(!old){ changedFlowIds.add(id); details.push(flowChangeSummary(flow,after,"新增")); }
    else if(JSON.stringify(old)!==JSON.stringify(flow)){
      changedFlowIds.add(id);
      details.push(`${flowChangeSummary(old,before,"修改前")}；${flowChangeSummary(flow,after,"修改后")}`);
    }
  });
  beforeFlows.forEach((flow,id)=>{ if(!afterFlows.has(id)){ changedFlowIds.add(id); details.push(flowChangeSummary(flow,before,"删除")); } });

  const beforeAssets=new Map((before.balance||[]).map(row=>[row.id,row]));
  const afterAssets=new Map((after.balance||[]).map(row=>[row.id,row]));
  const flowChanged=changedFlowIds.size>0;
  afterAssets.forEach((row,id)=>{
    const old=beforeAssets.get(id);
    if(!old){ details.push(`新增资产「${row.name}」`); return; }
    const changes=[];
    if(old.group!==row.group) changes.push(`分组 ${old.group||"未分组"} → ${row.group||"未分组"}`);
    if(Boolean(old.auto)!==Boolean(row.auto)) changes.push(`自动股价 ${old.auto?"开启":"关闭"} → ${row.auto?"开启":"关闭"}`);
    if(old.symbol!==row.symbol&&row.cls==="stock") changes.push(`代码 ${old.symbol||"—"} → ${row.symbol||"—"}`);
    if(old.priceStatus!==row.priceStatus&&row.cls==="stock") changes.push(`价格状态 ${old.priceStatus||"未更新"} → ${row.priceStatus==="ok"?"已更新":row.priceStatus==="warn"?"更新失败":row.priceStatus||"未更新"}`);
    // 流水本身已完整说明余额/数量联动，避免同一变更重复占满同步提示。
    if(!flowChanged){
      if(row.cls==="stock"){
        if(Number(old.qty||0)!==Number(row.qty||0)) changes.push(`数量 ${fmtQuantity(old.qty)} → ${fmtQuantity(row.qty)}`);
        if(Number(old.price||0)!==Number(row.price||0)) changes.push(`价格 ${fmtPrice(old.price)} → ${fmtPrice(row.price)} ${row.currency||"CNY"}`);
      }else if(Number(old.value||0)!==Number(row.value||0)){
        const field=row.cls==="cash"||row.cls==="liability"?"余额":"估值";
        changes.push(`${field} ${fmtFull(old.value)} → ${fmtFull(row.value)} ${row.currency||"CNY"}`);
      }
    }
    if(changes.length) details.push(`「${row.name}」${changes.join("；")}`);
  });
  beforeAssets.forEach((row,id)=>{ if(!afterAssets.has(id)) details.push(`删除资产「${row.name}」`); });
  const currencies=new Set([...Object.keys(before.fxRates||{}),...Object.keys(after.fxRates||{})]);
  currencies.forEach(currency=>{
    const old=Number(before.fxRates?.[currency]??1), value=Number(after.fxRates?.[currency]??1);
    if(old!==value) details.push(`${currency} 汇率 ${fmtPrice(old)} → ${fmtPrice(value)}`);
  });
  return (details.length?details:[fallback]).slice(0,20);
}
function appendMonthChange(month,label,details=[]){

  month.changeLog.push({revision:Number(month.revision||0),at:month.updatedAt,label:textValue(label||"更新月度数据",120),details:(details||[]).map(item=>textValue(item,240)).filter(Boolean).slice(0,20)});
  if(month.changeLog.length>80) month.changeLog.splice(0,month.changeLog.length-80);
}
function markMonthChanged(key,label,details=[]){

  month.updatedAt=new Date().toISOString();
  appendMonthChange(month,label,details);
}
async function transact(label,mutator,{touch=true,render=true}={}){
  const snapshot=structuredClone(ledger);
  const beforeMonth=activeMonth?snapshot?.months?.[activeMonth]:null;
  try{
    const result=await mutator();
    if(result===false){ ledger=snapshot; return false; }
    if(touch) markMonthChanged(activeMonth,label,describeMonthChanges(beforeMonth,ledger?.months?.[activeMonth],label));
    await persist(touch);
    if(render){ renderMonthTabs(); renderMonthPanel(); renderTrend(); }
    return true;
  }catch(error){
    ledger=snapshot;
    console.error(label,error);
    alert(`${label}失败：${error.message||"数据未保存"}`);
    if(render){ renderMonthTabs(); renderMonthPanel(); renderTrend(); }
    return false;
  }
}
function fmtFull(n){
  if(n==null||isNaN(n)) return "-";
  n=Number(n);
  const neg=n<0, a=Math.abs(n);
  let s;
  if(a>=100) s=Math.round(a).toLocaleString("zh-CN");
  else if(a>=10) s=a.toFixed(1);
  else s=a.toFixed(2);
  return (neg?"-":"")+s;
}
function fmtCompact(n){
  if(n==null||isNaN(n)) return "-";
  n=Number(n);
  const neg=n<0, a=Math.abs(n);
  let s;
  if(a>=1e6)      s=(a/1e6).toFixed(2)+"M";
  else if(a>=1e4) s=Math.round(a/1e3)+"K";
  else if(a>=100) s=Math.round(a).toLocaleString("zh-CN");
  else if(a>=10)  s=a.toFixed(1);
  else            s=a.toFixed(2);
  return (neg?"-":"")+s;
}
function fmt(n){ return fmtCompact(n); }
function fmtTrend(n){

}
function amount(n){

function fmtMoney(n){
  if(n==null||isNaN(n)) return "-";

function fmtQuantity(n){

function fmtPrice(n){

function parseArithmetic(value,label="金额"){
  const source=String(value??"").replace(/,/g,"").replaceAll("×","*").replaceAll("÷","/").trim();
  if(!source) throw new Error(`请填写${label}`);
  if(!/^[0-9+\-*/().\s]+$/.test(source)) throw new Error(`${label}只支持数字、小数点、括号和 + - × ÷ 运算`);
  let i=0;
  const skip=()=>{ while(/\s/.test(source[i]||"")) i++; };
  const primary=()=>{
    skip();
    if(source[i]==="("){
      i++; const out=sum(); skip();
      if(source[i]!==")") throw new Error(`${label}表达式括号不匹配`);
      i++; return out;
    }
    const match=source.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)/);
    if(!match) throw new Error(`${label}表达式格式无效`);
    i+=match[0].length;
    return Number(match[0]);
  };
  const unary=()=>{ skip(); if(source[i]==="+"){ i++; return unary(); } if(source[i]==="-"){ i++; return -unary(); } return primary(); };
  const product=()=>{
    let out=unary();
    while(true){ skip(); const op=source[i]; if(op!=="*"&&op!=="/") break; i++; const right=unary(); if(op==="/"){ if(right===0) throw new Error(`${label}不能除以 0`); out/=right; } else out*=right; }
    return out;
  };
  const sum=()=>{
    let out=product();
    while(true){ skip(); const op=source[i]; if(op!=="+"&&op!=="-") break; i++; const right=product(); out=op==="+"?out+right:out-right; }
    return out;
  };
  const result=sum(); skip();
  if(i!==source.length||!Number.isFinite(result)) throw new Error(`${label}表达式结果无效`);
  return result;
}

function b64(bytes){
  const data=new Uint8Array(bytes); let binary="";
  for(let i=0;i<data.length;i+=0x8000) binary+=String.fromCharCode(...data.subarray(i,i+0x8000));
  return btoa(binary);
}
function unb64(value){ return Uint8Array.from(atob(value),c=>c.charCodeAt(0)); }
async function deriveEncryptionKey(password,salt){
  const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:210000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function protectLedger(data,password){
  if(!crypto.subtle) throw new Error("当前浏览器不支持本地加密");
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveEncryptionKey(password,salt);
  const ciphertext=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(data)));
  return {schema:"nimble-ledger-encrypted-v1",encryption:{kdf:"PBKDF2-SHA-256",iterations:210000,salt:b64(salt)},iv:b64(iv),ciphertext:b64(ciphertext),key,meta:{salt:b64(salt)}};
}

}
async function unlockLedger(wrapper,password){
  try{
    const salt=unb64(wrapper.encryption.salt), key=await deriveEncryptionKey(password,salt);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(wrapper.iv)},key,unb64(wrapper.ciphertext));
    return {data:JSON.parse(new TextDecoder().decode(plain)),key,meta:{salt:wrapper.encryption.salt}};
  }catch(e){ throw new Error("密码错误或加密账本已损坏"); }
}

function newLedger(name){
  return {
    schema:"family-ledger-v2", name, createdAt:new Date().toISOString(),
    months:{}   // 汇率下沉到每个月(与时间相关)
  };
}
function newMonth(){
  const now=new Date().toISOString();
  return { balance:[], flows:[], fxRates:{CNY:1}, createdAt:now, updatedAt:now, revision:0, sourceRevision:0, changeLog:[] };
}
function ensureMonthMetadata(data){
  const now=new Date().toISOString();
  Object.values(data?.months||{}).forEach(m=>{
    if(!m.createdAt) m.createdAt=now;
    if(!m.updatedAt) m.updatedAt=m.createdAt;
    if(m.copiedFrom&&!m.sourceUpdatedAt) m.sourceUpdatedAt=m.createdAt;
    if(!Number.isFinite(Number(m.revision))) m.revision=0;
    if(!Number.isFinite(Number(m.sourceRevision))) m.sourceRevision=0;
    m.changeLog=Array.isArray(m.changeLog)?m.changeLog.filter(entry=>entry&&Number.isFinite(Number(entry.revision))).slice(-80).map(entry=>({
      revision:Number(entry.revision),at:textValue(entry.at||m.updatedAt,40),label:textValue(entry.label||"更新月度数据",120),
      details:Array.isArray(entry.details)?entry.details.map(item=>textValue(item,240)).filter(Boolean).slice(0,20):[]
    })):[];
  });
}
/* 资产条目 balance row 结构:
   { id, cls:'stock'|'cash'|'liability'|'fixed', group, name, account,
     qty, price, currency, value,           // value=原币金额(股票=qty*price;其它直接填)
     auto:bool, market, symbol, priceStatus:'ok'|'warn'|null, priceAt }
   总金额(人民币) = value * fxRate(currency) * clsSign
*/


// ---------- 计算 ----------
function curFx(){ const m=ledger.months[activeMonth]; if(m&&!m.fxRates) m.fxRates={CNY:1}; return m?m.fxRates:{CNY:1}; }
function fxRate(cur,mKey=activeMonth){
  const m=ledger.months[mKey]; const rates=m?.fxRates||{CNY:1};
  const r=rates[cur]; return (r==null||isNaN(r))?1:Number(r);
}
// 原币金额: 股票=数量×价格; 其它=直接填的 value
function rowNative(row){
  if(row.cls==="stock") return Number(row.qty||0)*Number(row.price||0);
  return Number(row.value||0);
}
// 人民币总金额(带符号: 负债为负)
function rowCNY(row,mKey=activeMonth){
  const cls = ASSET_CLASSES[row.cls]; const sign = cls?cls.sign:1;
  return rowNative(row)*fxRate(row.currency||"CNY",mKey)*sign;
}
// 收集当前月出现过的所有货币
function usedCurrencies(){
  const s = new Set(["CNY"]);
  const m = ledger.months[activeMonth];
  if(m) m.balance.forEach(r=>{ if(r.currency) s.add(r.currency); });
  return [...s];
}
function monthTotals(mKey){
  const m = ledger.months[mKey];
  if(!m) return {net:0,assets:0,liab:0,income:0,expense:0};
  let net=0, assets=0, liab=0;
  m.balance.forEach(r=>{ const v=rowCNY(r,mKey); net+=v; if(v<0) liab+=v; else assets+=v; });
  let income=0, expense=0;
  m.flows.forEach(f=>{ if(f.kind==="income"||f.kind==="dividend") income+=Number(f.amount||0); else if(f.kind==="expense") expense+=Number(f.amount||0); });
  return {net,assets,liab,income,expense};
}
function previousMonthKey(mKey){
  const [year,month]=mKey.split("-").map(Number);
  const d=new Date(year,month-2,1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function cashFlowTotals(mKey){
  const m=ledger.months[mKey];
  const detail={income:0,nonCashIncome:0,dividend:0,expense:0,buy:0,sell:0,repay:0,transfer:0};
  let inflow=0, outflow=0;
  (m?.flows||[]).forEach(f=>{
    const amount=flowAmount(f)*fxRate(f.currency||"CNY",mKey);
    if(f.kind==="income"){
      if(f.nonCashIncome===true) detail.nonCashIncome+=amount;
      else { detail.income+=amount; inflow+=amount; }
    }else{
      detail[f.kind]=(detail[f.kind]||0)+amount;
    }
    if(f.kind==="dividend") inflow+=amount;
    else if(f.kind==="expense"||f.kind==="repay") outflow+=amount;
    else if(f.kind==="buy"){ if(amount>=0) outflow+=amount; else inflow-=amount; }
    else if(f.kind==="sell"){ if(amount>=0) inflow+=amount; else outflow-=amount; }
  });
  return {inflow,outflow,net:inflow-outflow,detail};
}
function monthKeysDesc(){ return Object.keys(ledger.months).sort().reverse(); } // 最近月在前
// 某月按分组的人民币金额(用于堆叠图)
function monthGroupTotals(mKey){
  const m=ledger.months[mKey]; const g={};
  if(m) m.balance.forEach(r=>{ const k=r.group||"未分组"; g[k]=(g[k]||0)+rowCNY(r,mKey); });
  return g;
}
function flowCNY(f,mKey){ return flowAmount(f)*fxRate(f.currency||"CNY",mKey); }
function contributionGroup(row){
  const prefix=row.cls==="liability"?"负债":"资产";
  return prefix+"·"+(row.group||ASSET_CLASSES[row.cls]?.name||"未分组");
}
// 逐资产扣除流水的直接影响：交易按成本/成交额，资产收益归入来源资产，剩余即价格、汇率或手工估值贡献。
// 该结果同时供月度资产负债表与整体趋势使用，避免两处归因口径不一致。
function assetProfitAttribution(mKey,prevKey){
  const m=ledger.months[mKey];
  if(!m) return {m:mKey,rowPnl:{},entries:[],isBaseline:true};
  if(!prevKey||!ledger.months[prevKey]){
    const entries=m.balance.map(row=>({id:row.id,row,pnl:0}));
    return {m:mKey,rowPnl:Object.fromEntries(entries.map(x=>[x.id,0])),entries,isBaseline:true};
  }
  const prev=ledger.months[prevKey]||{balance:[]};
  const expected={}, expectedNative={}, assetIncome={}, realized={};
  const addExpected=(assetId,value)=>{ if(assetId) expected[assetId]=(expected[assetId]||0)+value; };
  const addExpectedNative=(assetId,value)=>{ if(assetId) expectedNative[assetId]=(expectedNative[assetId]||0)+value; };
  const addAssetIncome=(assetId,value)=>{ if(assetId) assetIncome[assetId]=(assetIncome[assetId]||0)+value; };
  const addRealized=(assetId,value)=>{ if(assetId) realized[assetId]=(realized[assetId]||0)+value; };
  (m.flows||[]).forEach(f=>{
    const value=flowCNY(f,mKey);
    if(f.kind==="income"){
      addExpected(f.toAssetId,+value); addExpectedNative(f.toAssetId,+flowAmount(f));
    }else if(f.kind==="expense"){
      addExpected(f.fromAssetId,-value); addExpectedNative(f.fromAssetId,-flowAmount(f));
    }
    else if(f.kind==="buy"){
      addExpected(f.fromAssetId,-value); addExpected(f.toAssetId,+value);
      addExpectedNative(f.fromAssetId,-flowAmount(f));
    }else if(f.kind==="sell"){
      addExpected(f.toAssetId,+value); addExpected(f.fromAssetId,-value);
      addExpectedNative(f.toAssetId,+flowAmount(f));
      addRealized(f.fromAssetId,Number(f.realizedPnlCNY||0));
    }else if(f.kind==="dividend"){
      addExpected(f.toAssetId,+value); addExpectedNative(f.toAssetId,+flowAmount(f)); addAssetIncome(f.fromAssetId,value);
    }else if(f.kind==="transfer"){
      addExpected(f.fromAssetId,-value);
      const toRow=assetByFlow(m,f,"to"), toCurrency=f.toCurrency||toRow?.currency||f.currency||"CNY";
      const toAmount=Number(f.toAmount!=null?f.toAmount:f.amount||0);
      addExpected(f.toAssetId,toAmount*fxRate(toCurrency,mKey));
      addExpectedNative(f.fromAssetId,-flowAmount(f)); addExpectedNative(f.toAssetId,+toAmount);
    }else if(f.kind==="repay"){
      addExpected(f.fromAssetId,-value); addExpected(f.toAssetId,+value);
      addExpectedNative(f.fromAssetId,-flowAmount(f)); addExpectedNative(f.toAssetId,-flowAmount(f));
    }
  });
  const curById=new Map(m.balance.map(row=>[row.id,row]));
  const prevById=new Map((prev.balance||[]).map(row=>[row.id,row]));
  const rowPnl={}, entries=[];
  new Set([...curById.keys(),...prevById.keys()]).forEach(id=>{
    const current=curById.get(id), previous=prevById.get(id), row=current||previous;
    const delta=(current?rowCNY(current,mKey):0)-(previous?rowCNY(previous,prevKey):0);
    const pnl=delta-(expected[id]||0)+(assetIncome[id]||0);
    const manualAdjustment=row?.cls==="cash"
      ? ((current?rowNative(current):0)-(previous?rowNative(previous):0)-(expectedNative[id]||0))*fxRate(row.currency||"CNY",mKey)
      : 0;
    const fxImpact=row?.cls==="cash"?pnl-(assetIncome[id]||0)-manualAdjustment:0;
    rowPnl[id]=pnl;
    entries.push({id,row,pnl,income:assetIncome[id]||0,realized:realized[id]||0,manualAdjustment,fxImpact,unrealized:pnl-(assetIncome[id]||0)-(realized[id]||0)});
  });
  return {m:mKey,rowPnl,entries,isBaseline:false};
}
function profitAttribution(mKey,prevKey){
  if(!prevKey||!ledger.months[prevKey]) return {m:mKey,deltas:{},netDelta:0,isBaseline:true};
  const asset=assetProfitAttribution(mKey,prevKey);
  const deltas={};
  (ledger.months[mKey]?.flows||[]).forEach(f=>{
    const value=flowCNY(f,mKey);
    if(f.kind==="income") deltas["收入"]=(deltas["收入"]||0)+value;
    else if(f.kind==="expense") deltas["支出"]=(deltas["支出"]||0)-value;
  });
  asset.entries.forEach(({row,pnl})=>{
    const group=contributionGroup(row);
    deltas[group]=(deltas[group]||0)+pnl;
  });
  const netDelta=monthTotals(mKey).net-monthTotals(prevKey).net;
  const explained=Object.values(deltas).reduce((sum,value)=>sum+value,0);
  const residual=netDelta-explained;
  if(Math.abs(residual)>0.01) deltas["未解释调整"]=residual;
  return {m:mKey,deltas,netDelta,isBaseline:false};
}

// ---------- 存储层 (严格文件绑定) ----------
async function persist(touchActiveMonth=true){
  if(!ledger) return;
  if(demoMode){
    setStatus("示例账本已修改；请点击「下载示例副本」保存为自己的 JSON");
    renderStorageInfo();
    return;
  }
  if(!fileHandle){ setStatus("⚠️ 未绑定文件，无法保存"); return; }
  try{
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(await serializeLedger(),null,2));
    await w.close();
    localStorage.setItem(LS_ACTIVE, ledger.name);
    setStatus(`已自动保存到 ${directoryHandle?.name ? directoryHandle.name+"/" : ""}${fileHandle.name} · ${new Date().toLocaleTimeString()}`);
  }catch(e){
    setStatus("保存失败: "+e.message);
    renderStorageInfo();
    throw new Error("写入文件失败："+e.message+"（可能是权限被回收，请重新用「打开 JSON」授权）");
  }
  renderStorageInfo();
}

      }

        alert(`「${k}」被后续月份引用，无法删除。`);

async function addMonth(){
  const def = new Date().toISOString().slice(0,7);
  const k = prompt("添加月份 (YYYY-MM):", def);
  if(!k) return;
  if(!/^\d{4}-\d{2}$/.test(k)){ alert("格式应为 YYYY-MM"); return; }
  if(ledger.months[k]){ balanceEditMode=false; flowEditMode=false; activeMonth=k; renderMonthTabs(); renderMonthPanel(); return; }
  const month=newMonth();
  const next=Object.keys(ledger.months).filter(x=>x>k).sort()[0]||null;
  // 取最近的一个更早月份作为拷贝对象: 拷贝资产负债表 + 汇率, 不拷贝流水
  const prev = Object.keys(ledger.months).filter(x=>x<k).sort().pop();
  if(prev){
    // 拷贝上月资产,但已清仓(数量/金额归零)的持有资产不再带入
    month.balance = ledger.months[prev].balance
      .map(r=>{
        const c={...r};
        delete c.openedThisMonth;
        delete c.priceStatus; delete c.priceAt; delete c.manualPriceAt;
        if(isClosed(c)) c.inactive=true; else delete c.inactive;
        return c;
      });
    month.fxRates = {...(ledger.months[prev].fxRates||{CNY:1})};
    month.copiedFrom = prev;
    month.sourceUpdatedAt = ledger.months[prev].updatedAt||month.createdAt;
    month.sourceRevision=Number(ledger.months[prev].revision||0);
    month.opening = month.balance.map(r=>({id:r.id,cls:r.cls,name:r.name,qty:r.qty,value:r.value,price:r.price}));
  }
  const previousActive=activeMonth; balanceEditMode=false; flowEditMode=false; activeMonth=k;
  const ok=await transact("添加月份",()=>{
    ledger.months[k]=month;
    // 在现有月份之间补建月份时，把原直接子月改为继承新月份，保持单一时间链。
    if(prev&&next&&ledger.months[next]?.copiedFrom===prev){
      ledger.months[next].copiedFrom=k;
      ledger.months[next].sourceRevision=Number(month.revision||0);
      ledger.months[next].sourceUpdatedAt=month.updatedAt;
    }
  },{touch:false});
  if(!ok) activeMonth=previousActive;
}

function renderMonthPanel(){
  const el = $("monthPanel");
  if(!ledger){ el.innerHTML = `<div class="empty">请先「新建账本」或「打开…」一个账本。</div>`; return; }
  if(!activeMonth){ el.innerHTML = `<div class="empty">还没有月份，点上方「＋ 添加月份」开始。</div>`; return; }
  const m = ledger.months[activeMonth];
  const t = monthTotals(activeMonth);
  const net = t.net || 0;
  const prevKey=previousMonthKey(activeMonth);
  const prevTotals=ledger.months[prevKey] ? monthTotals(prevKey) : null;
  const cashFlow=cashFlowTotals(activeMonth);
  const prevCashFlow=prevTotals ? cashFlowTotals(prevKey) : null;
  // 与整体趋势一致：若中间月份缺失，仍以前一个已存在月份作为盈亏比较基准。
  const pnlPrevKey=Object.keys(ledger.months).filter(k=>k<activeMonth).sort().pop()||null;
  const assetPnl=assetProfitAttribution(activeMonth,pnlPrevKey);
  const manualFields=new Set((reconcile(activeMonth)?.issues||[]).filter(i=>i.id&&i.field).map(i=>`${i.id}:${i.field}`));
  const metricCard=(label,value,prevValue)=>{
    const valueClass=value<0?"neg":"";
    if(prevValue==null) return `<div class="card"><div class="label">${label}</div><div class="value num ${valueClass}">${amount(value)}</div></div>`;
    const delta=value-prevValue, deltaClass=delta>0?"pos":delta<0?"neg":"";
    const pct=prevValue===0 ? "—" : `${delta>0?"+":""}${(delta/Math.abs(prevValue)*100).toFixed(1)}%`;
    return `<div class="card"><div class="label">${label}</div><div class="value num ${valueClass}">${amount(value)}</div>
      <div class="cf-sub mut">月环比 <span class="num ${deltaClass}">${delta>0?"+":""}${amount(delta)}</span> · <span class="${deltaClass}">${pct}</span></div></div>`;
  };
  const pnlCell=(value,id)=>{
    const tone=value>0?"pos":value<0?"neg":"pnl-zero";
    const detail=assetPnl.entries.find(entry=>entry.id===id);
    const title=detail?.row?.cls==="cash"
      ? `本月盈亏：${fmtFull(value)}\n汇率影响：${fmtFull(detail.fxImpact||0)}\n资产收益：${fmtFull(detail.income||0)}\n余额调整：${fmtFull(detail.manualAdjustment||0)}`
      : detail?`本月盈亏：${fmtFull(value)}\n已实现：${fmtFull(detail.realized||0)}\n资产收益：${fmtFull(detail.income||0)}\n估值/汇兑：${fmtFull(detail.unrealized||0)}`:`完整本月盈亏：${fmtFull(value)}`;
    return `<span class="amount ${tone}" title="${escapeAttr(title)}">${value>0?"+":""}${fmtTrend(value)}</span>`;
  };

  // 按分组聚合
  const groups = {};
  const visibleBalance=m.balance.map((r,idx)=>({r,idx})).filter(({r})=>!r.inactive);
  visibleBalance.forEach(({r,idx})=>{ (groups[r.group||"未分组"] ||= []).push({r,idx}); });
  // 分组之间按组总金额降序
  const groupNames = Object.keys(groups).sort((a,b)=>{
    const sa=groups[a].reduce((s,x)=>s+rowCNY(x.r),0);
    const sb=groups[b].reduce((s,x)=>s+rowCNY(x.r),0);
    return sb-sa;
  });

  let body = "";
  if(!visibleBalance.length){
    body = `<tr><td colspan="9" class="empty">本月暂无资产条目，点「＋ 添加资产」开始。</td></tr>`;
  }else{
    groupNames.forEach(g=>{
      // 组内按人民币金额降序
      const items = groups[g].slice().sort((a,b)=>rowCNY(b.r)-rowCNY(a.r));
      let gSum=0, gPnl=0, gAssets=0, gLiabs=0;
      items.forEach(({r})=>{ const value=rowCNY(r); gSum+=value; gPnl+=assetPnl.rowPnl[r.id]||0; if(value>=0) gAssets+=value; else gLiabs+=Math.abs(value); });
      // 分组标题行
      body += `<tr class="group-head"><td colspan="9">${escapeHTML(g)}</td></tr>`;
      // 资产行
      body += items.map(({r,idx})=>{

      // 分组汇总行

        <td class="num subtotal-amount ${gSum<0?"neg":""}">${fmtMoney(gSum)}</td><td class="num mut subtotal-pct">${gPct}</td><td class="num">${pnlCell(gPnl)}</td><td></td></tr>`;

      const price=(cls.hasQty?`${fmtQuantity(r.qty)} × ${fmtPrice(r.price)} ${escapeHTML(r.currency||"CNY")}`:moneyCell(rowNative(r),r.currency||"CNY"))+priceAction;
      const autoBtn=(cls.hasAuto&&r.auto)?`<button class="mini icon-btn" data-price="${idx}" title="更新股价">↻</button>`:"";

  el.innerHTML = `

    ${renderMonthMeta()}

      <tbody>${body}</tbody>
    </table></div>
    <div class="balance-mobile">${mobileBalance||`<div class="empty">本月暂无资产条目</div>`}</div>
    ${renderFxBar()}

      <h3>流水表 · ${activeMonth}</h3>
      <div><button class="mini" id="btnFlowEdit">编辑</button><button class="primary mini" id="btnAddFlow">＋ 添加流水</button></div>

    ${renderFlowSummary()}

      <thead><tr><th>日期</th><th>类型</th><th>流出方</th><th>流入方</th><th>金额</th><th>备注</th><th>操作</th></tr></thead>

  // 事件
  const demoBackup=$("btnDemoBackup"); if(demoBackup) demoBackup.addEventListener("click",backupCurrentLedger);
  const demoCreate=$("btnDemoCreate"); if(demoCreate) demoCreate.addEventListener("click",openCreateDialog);
  const setTableEditing=(selector,button,editing)=>{
    const table=el.querySelector(selector);
    table.classList.toggle("editing",editing);
    if(selector===".balance") el.querySelector(".balance-mobile")?.classList.toggle("editing",editing);
    button.textContent=editing?"完成":"编辑";
  };
  setTableEditing(".balance",$("btnBalanceEdit"),balanceEditMode);
  setTableEditing(".flow",$("btnFlowEdit"),flowEditMode);
  $("btnBalanceEdit").addEventListener("click",e=>{ balanceEditMode=!balanceEditMode; setTableEditing(".balance",e.currentTarget,balanceEditMode); });
  $("btnFlowEdit").addEventListener("click",e=>{ flowEditMode=!flowEditMode; setTableEditing(".flow",e.currentTarget,flowEditMode); });
  $("btnAddAsset").addEventListener("click",()=>openAssetDialog(null));
  $("btnUpdateAll").addEventListener("click",async()=>{ await updateAllPrices(); await autoFetchFx(); });
  el.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>openAssetDialog(+b.dataset.edit)));
  el.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",async()=>{
    const row=m.balance[+b.dataset.del];
    if(!row) return;
    const keys=Object.keys(ledger.months).filter(key=>key>=activeMonth).sort();
    const related=keys.reduce((count,key)=>count+(ledger.months[key].flows||[]).filter(flow=>flow.fromAssetId===row.id||flow.toAssetId===row.id).length,0);
    if(!confirm(`删除资产「${row.name}」将影响 ${keys.length} 个月，并删除 ${related} 条相关流水。\n系统会先下载完整备份，是否继续？`)) return;
    await backupCurrentLedger();
    await transact("删除资产",()=>{
      keys.forEach(key=>{
        const month=ledger.months[key];
        const relatedFlows=(month.flows||[]).filter(flow=>flow.fromAssetId===row.id||flow.toAssetId===row.id);
        // 先回滚流水对现金、负债及其他持仓的影响，再删除资产和流水记录。
        relatedFlows.forEach(flow=>applyFlowToBalance(month.balance,flow,-1));
        month.flows=(month.flows||[]).filter(flow=>flow.fromAssetId!==row.id&&flow.toAssetId!==row.id);
        month.balance=(month.balance||[]).filter(asset=>asset.id!==row.id);
        if(month.opening) month.opening=month.opening.filter(asset=>asset.id!==row.id);
        if(key!==activeMonth) markMonthChanged(key,`删除资产：${row.name}及关联流水`);
      });
      // 后续月份的期初可能仍带有被删除流水造成的现金影响，沿继承链重建。
      let source=activeMonth;
      while(true){
        const child=childMonthOf(source);
        if(!child) break;
        rebuildChildFromParent(source,child);
        source=child;
      }
    });
  }));
  el.querySelectorAll("[data-price]").forEach(b=>b.addEventListener("click",()=>updateOnePrice(+b.dataset.price)));
  el.querySelectorAll("[data-price-edit]").forEach(b=>b.addEventListener("click",()=>openPriceEditor(+b.dataset.priceEdit)));
  $("btnAddFlow").addEventListener("click",()=>openFlowDialog(null));
  el.querySelectorAll("[data-fedit]").forEach(b=>b.addEventListener("click",()=>openFlowDialog(b.dataset.fedit)));
  el.querySelectorAll("[data-fdel]").forEach(b=>b.addEventListener("click",()=>deleteFlow(b.dataset.fdel)));
  bindFxBar();
  const bn=$("btnSyncNext"); if(bn) bn.addEventListener("click",()=>{ if(confirm("将本月期末同步为下月期初并重算下月？")) syncToNext(activeMonth); });
  const ba=$("btnSyncAll"); if(ba) ba.addEventListener("click",()=>{ if(confirm("沿拷贝链把改动同步到后续所有月份并重算？")) syncToAll(activeMonth); });
}

function renderDemoBanner(){

function assetLabel(assetId){
  const m=ledger.months[activeMonth]; const r=m.balance.find(row=>row.id===assetId);
  if(!r) return "(已删除)";
  const acc = r.account? r.account+"·" : "";
  return acc + (r.name||"");
}
// ---------- 月面板顶部: 拷贝来源 + 对账提示 ----------
function needsChildSync(fromKey,childKey){
  const parent=ledger.months[fromKey], child=ledger.months[childKey];
  if(!parent||!child) return false;
  return Number(parent.revision||0)>Number(child.sourceRevision||0);
}
function monthTimeText(value){
  const time=Date.parse(value||"");
  return Number.isFinite(time)?new Date(time).toLocaleString("zh-CN",{hour12:false}):"—";
}
function changesSince(month,revision){
  const current=Number(month.revision||0), received=Number(revision||0);
  const changes=(month.changeLog||[]).filter(change=>Number(change.revision)>received&&Number(change.revision)<=current);
  const firstRecorded=changes.length?Math.min(...changes.map(change=>Number(change.revision))):Infinity;
  const out=[];
  if(received+1<firstRecorded) out.push({revision:`v${received+1}–v${Math.min(current,firstRecorded-1)}`,label:"早期变更未记录详情"});
  changes.forEach(change=>out.push({revision:`v${Number(change.revision)}`,label:change.label,at:change.at,details:Array.isArray(change.details)?change.details:[]}));
  return out;
}
function renderCopyBanner(){
  const m=ledger.months[activeMonth];
  const child=childMonthOf(activeMonth);
  if(!child||!needsChildSync(activeMonth,child)) return "";
  const next=ledger.months[child];
  const changes=changesSince(m,next.sourceRevision);
  const changeHtml=changes.length
    ? `<ul class="sync-changes">${changes.slice(-12).map(change=>`<li><b>${escapeHTML(change.revision)}</b>　${escapeHTML(change.label)}${change.at?` <span class="mut">${escapeHTML(monthTimeText(change.at))}</span>`:""}${change.details?.length?`<ul class="sync-change-details">${change.details.map(detail=>`<li>${escapeHTML(detail)}</li>`).join("")}</ul>`:""}</li>`).join("")}${changes.length>12?`<li class="mut">另有 ${changes.length-12} 项较早修改</li>`:""}</ul>`
    : `<p class="mut" style="margin:8px 0 0">未找到可读的变更摘要；同步后将开始记录。</p>`;
  return `<details class="reconcile-status warn"><summary><i class="status-dot"></i><span class="status-label">后续月份待同步</span><span class="status-detail">${child} 期初待更新</span></summary>
    <div class="status-content">自 ${child} 上次接收 ${activeMonth} 的版本后，发生以下修改：
      ${changeHtml}
      <br>本月：创建于 ${monthTimeText(m.createdAt)}；最后修改 ${monthTimeText(m.updatedAt)}
      <br>${child}：创建于 ${monthTimeText(next.createdAt)}；最后修改 ${monthTimeText(next.updatedAt)}；已接收来源版本 ${Number(next.sourceRevision||0)} / 当前来源版本 ${Number(m.revision||0)}
      <div class="sync-row"><button class="mini" id="btnSyncNext">同步到下月</button><button class="mini" id="btnSyncAll">同步到后续所有月份</button></div></div></details>`;
}
function renderMonthMeta(){
  const m=ledger.months[activeMonth];
  const relation=m.copiedFrom?`继承自 ${escapeHTML(m.copiedFrom)}（来源版本 ${Number(m.sourceRevision||0)}）`:"独立创建";
  return `<div class="month-meta mut">创建：${monthTimeText(m.createdAt)}　最后修改：${monthTimeText(m.updatedAt)}　${relation}</div>`;
}

function renderFlowRows(){

    return `<tr><td colspan="7" class="empty">本月暂无流水，点「＋ 添加流水」开始。</td></tr>`;
  const sorted = m.flows.map((f,i)=>({f,i})).sort((a,b)=>(a.f.date||"").localeCompare(b.f.date||""));
  return sorted.map(({f,i})=>{
    const ft=FLOW_TYPES[f.kind];
    const fromTxt = escapeHTML(f.fromAssetId ? assetLabel(f.fromAssetId) : (f.fromText||"-"));
    const toTxt   = escapeHTML(f.toAssetId ? assetLabel(f.toAssetId) : (f.toText||"-"));

    if(f.kind==="dividend" && f.holdingAmount!=null && f.holdingCurrency && f.holdingCurrency!==f.currency)

    if(f.qty!=null&&f.price!=null) amt += ` <span class="mut">(${fmtQuantity(f.qty)} × ${fmtPrice(f.price)})</span>`;
    const typeCell = escapeHTML(ft?ft.name:f.kind) + (f.subcat?` <span class="mut">/${escapeHTML(f.subcat)}</span>`:"");
    const direction=(f.kind==="income"||f.kind==="dividend"||f.kind==="sell")?"flow-in":((f.kind==="expense"||f.kind==="buy"||f.kind==="repay")?"flow-out":"");

function renderFxBar(){

      <input type="number" step="0.0001" data-fx="${escapeAttr(c)}" value="${fxRate(c)}" ${c==="CNY"?"disabled":""} style="width:90px" />${badge}

function bindFxBar(){
  document.querySelectorAll("[data-fx]").forEach(inp=>{
    inp.addEventListener("change",async()=>{
      const value=Number(inp.value);
      if(!Number.isFinite(value)||value<=0){ alert("请输入大于 0 的汇率"); return; }
      await transact("手动更新汇率",()=>{
        curFx()[inp.dataset.fx]=value;
        if(curFx()._status) curFx()._status[inp.dataset.fx]="manual";
      });
    });
  });
  const b=$("btnAutoFx"); if(b) b.addEventListener("click",autoFetchFx);
}
// 自动获取当月汇率(Frankfurter, 免key, 支持历史)。目标日=当月末与今天取较早者
async function autoFetchFx(){
  const curs=usedCurrencies().filter(c=>c!=="CNY");
  if(!curs.length){ setStatus("本月没有需要换算的外币"); return; }
  const dateStr=ymd(targetDate(activeMonth));
  const symbols=[...new Set([...curs,"CNY"])].filter(c=>c!=="USD").join(",");
  setStatus("获取汇率中…");
  try{
    const res=await fetch(`https://api.frankfurter.dev/v1/${dateStr}?base=USD&symbols=${symbols}`);
    const data=await res.json();
    const usdTo=data.rates||{};
    const usdToCNY=usdTo.CNY;
    if(!(usdToCNY>0)) throw new Error("无CNY汇率");
    const updates={}, statuses={};
    curs.forEach(c=>{
      if(c==="CNY") return;
      if(c==="USD"){ updates.USD=Math.round(usdToCNY*1000)/1000; statuses.USD="ok"; return; }
      const usdToX=usdTo[c];
      if(usdToX>0){ updates[c]=Math.round(usdToCNY/usdToX*1000)/1000; statuses[c]="ok"; }
      else statuses[c]="warn";
    });
    await transact("更新汇率",()=>{ const fx=curFx(); fx._status={...(fx._status||{}),...statuses}; fx._date=data.date||dateStr; Object.assign(fx,updates,{CNY:1}); });
    setStatus(`汇率已按 ${data.date||dateStr} 更新`);
  }catch(e){
    await transact("记录汇率获取失败",()=>{ const fx=curFx(); fx._status=fx._status||{}; curs.forEach(c=>fx._status[c]="warn"); });
    setStatus("汇率自动获取失败: "+e.message+"（请手动填写）");
  }
}

  const dlg = $("assetDialog");

  $("adCls").value = r.cls||"stock";
  $("adGroup").value = r.group||"";
